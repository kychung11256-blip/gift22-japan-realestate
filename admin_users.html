<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帳號及指派 | 管理系統</title><link rel="stylesheet" href="/config/commercial.css"><script src="/config/commercial.js"></script></head><body><header><a href="/workbench">出雲ランドエステー · 管理系統</a><nav><a href="/admin/media-review">圖片審核</a><button id="logout" class="secondary">登出</button></nav></header><main><h1>帳號及客戶指派</h1><p class="muted">只供管理員使用。Agent 只可處理獲指派客戶及物件。</p><p id="status" role="status" aria-live="polite">確認權限中…</p><div id="adminContent" hidden><section class="panel"><h2>現有帳號</h2><div id="users" class="table-wrap"></div></section><section class="panel"><h2>新增帳號</h2><form id="userForm"><label>帳號<input name="username" autocomplete="off" required maxlength="80"></label><label>Email<input name="email" type="email" autocomplete="off"></label><label>初始密碼<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>角色<select name="role"><option value="agent">Agent 顧問</option><option value="client">Client 客戶</option><option value="admin">Admin 管理員</option></select></label><label>客戶 ID（client 必填）<input name="client_id"></label><label>Agent ID（agent 必填）<input name="agent_id"></label><button type="submit">建立帳號</button></form></section><section class="panel"><h2>Agent／客戶指派</h2><form id="assignmentForm"><label>Agent ID<input name="agent_id" required></label><label>客戶<select name="client_id" id="clients" required></select></label><button type="submit">新增指派</button></form><div id="assignments" class="table-wrap"></div></section></div></main><script>
const $=id=>document.getElementById(id),esc=Commercial.esc;
function notice(text,error=false){$('status').textContent=text;$('status').className=error?'error':'notice';}
async function load(){try{const session=await Commercial.session(true);if(session.user?.role!=='admin')throw Error('只供管理員存取，請使用已授權帳號登入。');const [users,assign,clients]=await Promise.all([Commercial.api('/api/admin/users'),Commercial.api('/api/admin/assignments'),Commercial.api('/api/v1/clients')]);$('adminContent').hidden=false;const list=users.users||[];$('users').innerHTML='<table><thead><tr><th>帳號</th><th>角色</th><th>客戶 ID</th><th>Agent ID</th></tr></thead><tbody>'+list.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${esc(u.client_id||'—')}</td><td>${esc(u.agent_id||'—')}</td></tr>`).join('')+'</tbody></table>';$('clients').innerHTML=(clients.clients||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.name)} (${esc(c.id)})</option>`).join('');$('assignments').innerHTML='<table><thead><tr><th>Agent ID</th><th>客戶 ID</th><th>操作</th></tr></thead><tbody>'+(assign.assignments||[]).map(a=>`<tr><td>${esc(a.agent_id)}</td><td>${esc(a.client_id)}</td><td><button class="secondary" data-agent="${esc(a.agent_id)}" data-client="${esc(a.client_id)}">撤回指派</button></td></tr>`).join('')+'</tbody></table>';$('assignments').querySelectorAll('button').forEach(btn=>btn.onclick=async()=>{if(!confirm('確認撤回此 Agent 嘅客戶指派？'))return;btn.disabled=true;try{await Commercial.post('/api/admin/assignments',{agent_id:btn.dataset.agent,client_id:btn.dataset.client},'DELETE');await load();notice('已撤回指派');}catch(e){notice(e.message,true);btn.disabled=false;}});notice(`已讀取 ${list.length} 個帳號`);}catch(e){$('adminContent').hidden=true;notice(e.message,true);}}
function bind(form,url){$(form).onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;const data=Object.fromEntries(new FormData(e.target));for(const k of ['client_id','agent_id'])if(!data[k])delete data[k];try{await Commercial.post(url,data);if(e.target.password)e.target.password.value='';await load();notice('操作已保存');}catch(err){notice(err.message,true);}finally{if(e.target.password)e.target.password.value='';btn.disabled=false;}};}bind('userForm','/api/admin/users');bind('assignmentForm','/api/admin/assignments');$('logout').onclick=async()=>{try{await Commercial.post('/logout');location.href='/login/staff';}catch(e){notice(e.message,true);}};load();
</script></body></html>
