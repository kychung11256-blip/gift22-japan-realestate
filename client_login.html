<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/config/commercial.css"><script src="/config/commercial.js"></script><title>客戶登入 | 出雲ランドエステー</title></head><body><header><a href="/">出雲ランドエステー</a><nav><a href="/listings">全部物件</a><a href="/login/staff">職員登入</a></nav></header><main class="login"><h1>客戶登入</h1><p class="muted">登入查看顧問為你整理嘅私人選盤。</p><form id="loginForm" class="panel"><label>帳號或 Email<input name="identifier" autocomplete="username" required maxlength="254"></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit" disabled>安全驗證中…</button><p id="status" class="notice" role="status" aria-live="polite"></p></form></main><script>
const form=document.getElementById('loginForm'),btn=document.getElementById('submit'),status=document.getElementById('status');
Commercial.session().then(()=>{btn.disabled=false;btn.textContent='登入';}).catch(()=>{status.textContent='無法取得安全驗證，請重新整理頁面。';});
form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;status.textContent='登入中…';try{const d=await Commercial.post('/login/client',Object.fromEntries(new FormData(form)));form.password.value='';const target=d.redirect||'/client/portal';location.href=target.startsWith('/')&&!target.startsWith('//')?target:'/client/portal';}catch(e){form.password.value='';status.classList.add('error');status.textContent=e.message;btn.disabled=false;}};
</script></body></html>
