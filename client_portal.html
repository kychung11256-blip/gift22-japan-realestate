<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私人選盤 | 出雲ランドエステー</title><link rel="stylesheet" href="/config/commercial.css"><script src="/config/commercial.js"></script></head><body><header><a href="/">出雲ランドエステー</a><nav><a href="/listings">全部物件</a><button id="logout" class="secondary">登出</button></nav></header><main><h1>你嘅私人選盤</h1><p id="client" class="muted">由顧問為你整理。</p><p id="status" role="status" aria-live="polite">正在讀取私人選盤…</p><section id="items" class="grid"></section></main><script>
const esc=Commercial.esc;
async function load(){try{const d=await Commercial.api('/api/client/portal');document.getElementById('client').textContent=d.client?.name?`${d.client.name} · 私人選盤`:'私人選盤';const items=d.items||[];document.getElementById('status').textContent=items.length?`${items.length} 個物件`:'顧問正為你整理合適物件，稍後再返嚟睇。';document.getElementById('items').innerHTML=items.map(p=>{const imgs=[...(p.images||[]).map(x=>x.url||x),...(p.photos||[]),...(p.floorplan_images||[]).map(x=>x.url||x)].map(Commercial.safeMedia).filter(Boolean);const raw=p.priceYen?Number(p.priceYen)/10000:Number(p.price||0);return `<article class="property">${imgs[0]?`<img src="${esc(imgs[0])}" alt="已審核物件圖片" onerror="this.outerHTML='<div class=placeholder>安全圖片準備中</div>'">`:'<div class="placeholder">安全圖片準備中</div>'}<div class="copy"><h2>${esc(p.title||p.building_name||p.address||'物件')}</h2><p>${esc(p.address)}</p><strong>${raw?new Intl.NumberFormat('zh-HK').format(raw)+' 萬円':'價格待確認'}</strong><p>${esc(p.layout||p.room_layout||'間隔待確認')} · ${esc(p.areaSqm||p.size_sqm||'—')} m²</p><p>建築年月 ${esc(Commercial.date(p.builtAt||p.built_date_full||p.built_year))}</p><a href="/listing/${encodeURIComponent(p.id)}">查看物件詳情 →</a></div></article>`;}).join('');}catch(e){document.getElementById('status').className='error';document.getElementById('status').textContent=e.message;}}
document.getElementById('logout').onclick=async()=>{try{await Commercial.post('/logout');location.href='/login/client';}catch(e){document.getElementById('status').textContent=e.message;}};load();
</script></body></html>
