<script>

  "areas":{"千代田区":{"avg_price_man":8900,"price_per_sqm_man":145.0,"transactions_man":85},"中央区":{"avg_price_man":7800,"price_per_sqm_man":138.0},"港区":{"avg_price_man":12000,"price_per_sqm_man":175.0},"新宿区":{"avg_price_man":6200,"price_per_sqm_man":105.0},"文京区":{"avg_price_man":6800,"price_per_sqm_man":110.0},"台東区":{"avg_price_man":5500,"price_per_sqm_man":95.0},"墨田区":{"avg_price_man":4200,"price_per_sqm_man":75.0},"江東区":{"avg_price_man":5200,"price_per_sqm_man":85.0},"品川区":{"avg_price_man":6500,"price_per_sqm_man":108.0},"目黒区":{"avg_price_man":7200,"price_per_sqm_man":118.0},"大田区":{"avg_price_man":4500,"price_per_sqm_man":78.0},"世田谷区":{"avg_price_man":5800,"price_per_sqm_man":92.0},"渋谷区":{"avg_price_man":9500,"price_per_sqm_man":155.0},"中野区":{"avg_price_man":4800,"price_per_sqm_man":82.0},"杉並区":{"avg_price_man":4600,"price_per_sqm_man":80.0},"豊島区":{"avg_price_man":5100,"price_per_sqm_man":88.0},"北区":{"avg_price_man":3800,"price_per_sqm_man":68.0},"荒川区":{"avg_price_man":3500,"price_per_sqm_man":65.0},"板橋区":{"avg_price_man":3600,"price_per_sqm_man":66.0},"練馬区":{"avg_price_man":4000,"price_per_sqm_man":72.0},"足立区":{"avg_price_man":3200,"price_per_sqm_man":60.0},"葛飾区":{"avg_price_man":3000,"price_per_sqm_man":58.0},"江戸川区":{"avg_price_man":3400,"price_per_sqm_man":62.0},"武蔵野市":{"avg_price_man":5500,"price_per_sqm_man":90.0},"三鷹市":{"avg_price_man":4200,"price_per_sqm_man":75.0},"横浜市":{"avg_price_man":3500,"price_per_sqm_man":62.0},"川崎市":{"avg_price_man":3800,"price_per_sqm_man":68.0},"さいたま市":{"avg_price_man":2800,"price_per_sqm_man":52.0},"千葉市":{"avg_price_man":2500,"price_per_sqm_man":48.0}},
};

// ── Operations KPI ──
async function loadOpsKpi() {
  try {
    const r = await fetch('/api/dashboard');
    const d = await r.json();
    document.getElementById('kpiTotal').textContent = (d.total || 0).toLocaleString();
    document.getElementById('kpiPublished').textContent = (d.published || 0).toLocaleString();
    document.getElementById('kpiDraft').textContent = (d.draft || 0).toLocaleString();
    const avg = d.avg_price || 0;
    document.getElementById('kpiAvgPrice').innerHTML = avg >= 10000
      ? (avg/10000).toFixed(1) + '<span class="text-base text-dim"> 億円</span>'
      : avg.toLocaleString() + '<span class="text-base text-dim"> 万円</span>';
    document.getElementById('opsUpdated').textContent = '即時';
  } catch (e) {
    document.getElementById('opsUpdated').textContent = '無法載入';
    document.getElementById('kpiTotal').textContent = '—';
    document.getElementById('kpiPublished').textContent = '—';
    document.getElementById('kpiDraft').textContent = '—';
    document.getElementById('kpiAvgPrice').textContent = '—';
  }
}

// Init
async function init(){
  const sel=document.getElementById('valArea');
  Object.keys(DATA.areas).sort().forEach(a=>{sel.innerHTML+=`<option value="${a}">${a}</option>`});
  drawAreaChart();
  drawTrendChart();
  loadOpsKpi();
  loadMarketIntel();
  loadWeather();
  await loadAllListings();
  // Scroll-reveal observer
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const obs=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}})},{threshold:0.15});
    document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
  }else{
    document.querySelectorAll('.reveal').forEach(el=>el.classList.add('visible'));
  }
}

async function loadAllListings(){
  try{
    const r=await fetch('/api/search');
    const data=await r.json();
    showResults(data.listings||[],'全部物件');
  }catch(e){
    document.getElementById('resultsGrid').innerHTML='<div class="col-span-full text-center py-12 text-dim">無法載入數據，請確認伺服器已啟動</div>';
  }
}

function quickSearch(q){document.getElementById('searchInput').value=q;doSearch();}

function showHints(val){
  const hints=document.getElementById('searchHints');
  const list=document.getElementById('hintList');
  if(!val||val.length<1){hints.classList.add('hidden');return;}
  const suggestions=[
    {text:'港区',desc:'高級住宅區'},{text:'渋谷区',desc:'商業中心'},{text:'新宿区',desc:'交通樞紐'},
    {text:'5000万以下',desc:'價格篩選'},{text:'1億以下',desc:'價格篩選'},{text:'投資用',desc:'高回報率'},
    {text:'駅近',desc:'步行5分鐘內'},{text:'新築',desc:'築5年以內'},
  ];
  const v=val.toLowerCase();
  const filtered=suggestions.filter(s=>s.text.toLowerCase().includes(v)||val.length<2);
  if(filtered.length===0){hints.classList.add('hidden');return;}
  list.innerHTML=filtered.slice(0,6).map(s=>`<div class="flex items-center justify-between px-2 py-1.5 rounded-lg hover:bg-gold-muted cursor-pointer text-sm" onmousedown="quickSearch('${s.text}')"><span>${s.text}</span><span class="text-xs text-dim">${s.desc}</span></div>`).join('');
  hints.classList.remove('hidden');
}

let searchMode='local';
function setSearchMode(m){
  searchMode=m;
  const on='text-xs px-3 py-1 rounded-full border transition-colors bg-gold text-black border-gold';
  const off='text-xs px-3 py-1 rounded-full border transition-colors bg-surface-elevated text-dim border-border hover:border-gold/50';
  document.getElementById('modeLocal').className=m==='local'?on:off;
  document.getElementById('modeReins').className=m==='reins'?on:off;
  document.getElementById('planPanel').classList.toggle('hidden',m!=='reins');
}

async function doSearch(){
  if(searchMode==='reins'){await doReinsSearch();return;}
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){await loadAllListings();return;}
  try{
    const r=await fetch('/api/search?q='+encodeURIComponent(q));
    const data=await r.json();
    if(data.listings&&data.listings.length>0){showResults(data.listings,`「${q}」`);return;}
  }catch(e){}
  try{
    const r=await fetch('/api/search');
    const data=await r.json();
    let results=(data.listings||[]).filter(p=>{
      const text=`${p.address} ${p.price}万円 ${p.price_per_sqm}万円/m2 ${p.size_sqm}m2 ${p.age}年 ${p.room_layout} ${p.station} ${p.walk_min}分 ${p.orientation} ${p.type} ${p.structure}`.toLowerCase();
      const tokens=q.split(/[\s,，、]+/);
      return tokens.every(t=>{
        if(t==='投資用'||t==='investment')return(p.yield_surface||0)>=4.5;
        if(t==='駅近'||t==='station')return(p.walk_min||0)<=5;
        if(t==='新築'||t==='new')return(p.age||0)<=5;
        if(t.includes('万以下')){const max=parseInt(t.replace(/[^0-9]/g,''));return p.price<=max;}
        if(t.includes('万以上')){const min=parseInt(t.replace(/[^0-9]/g,''));return p.price>=min;}
        if(t.includes('億以下')){const max=parseFloat(t.replace(/[^0-9.]/g,''))*10000;return p.price<=max;}
        if(t.includes('分')||t.includes('min')){const mins=parseInt(t.replace(/[^0-9]/g,''));return(p.walk_min||0)<=mins;}
        if(t.includes('m2')||t.includes('sqm')){const sz=parseInt(t.replace(/[^0-9]/g,''));return(p.size_sqm||0)>=sz;}
        return text.includes(t);
      });
    });
    results.sort((a,b)=>{const aM=q.includes(a.address.toLowerCase())?0:1;const bM=q.includes(b.address.toLowerCase())?0:1;return aM-bM;});
    showResults(results,`「${q}」`);
  }catch(e){showResults([],`「${q}」`);}
}

// ── REINS 智能搜尋（自然語言 → SearchPlan → REINS）──
async function doReinsSearch(){
  const q=document.getElementById('searchInput').value.trim();
  const panel=document.getElementById('planPanel');
  const info=document.getElementById('nlParseInfo');
  const grid=document.getElementById('resultsGrid');
  const section=document.getElementById('resultsSection');
  const title=document.getElementById('resultsTitle');
  const count=document.getElementById('resultsCount');
  if(!q){panel.innerHTML='<span class="text-dim">請輸入自然語言搜尋，例如「中央区 8000万円以下 2LDK 景觀好」</span>';return;}
  panel.classList.remove('hidden');
  panel.innerHTML='<span class="text-dim">🔄 解析需求 + REINS 搜尋中（約 15-25 秒）...</span>';
  info.textContent='';
  try{
    const r=await fetch('/api/nl-search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,page:1})});
    const d=await r.json();
    // 顯示 SearchPlan
    panel.innerHTML=renderPlan(d);
    if(d.meta&&d.meta.parser)info.textContent=`解析：${d.meta.parser==='rule'?'關鍵字':d.meta.parser==='llm'?'AI':'—'}`;
    if(d.code===401||d.auth){
      grid.innerHTML='<div class="col-span-full text-center py-12 text-warn">⚠️ REINS session 已失效，請重新登入</div>';
      section.classList.remove('hidden');title.textContent='REINS 智能搜尋';count.textContent='';return;
    }
    if(d.need_clarification){
      grid.innerHTML=`<div class="col-span-full text-center py-12 text-dim">${esc(d.error||'需要更多資訊')}<br><span class="text-xs">請講明邊個區、預算、房型</span></div>`;
      section.classList.remove('hidden');title.textContent='REINS 智能搜尋';count.textContent='';return;
    }
    if(d.code!==1){
      grid.innerHTML=`<div class="col-span-full text-center py-12 text-bad">${esc(d.error||'搜尋失敗')}</div>`;
      section.classList.remove('hidden');title.textContent='REINS 智能搜尋';count.textContent='';return;
    }
    showReinsResults(d.listings||[],d);
  }catch(e){
    panel.innerHTML=`<span class="text-bad">搜尋失敗：${esc(e.message)}</span>`;
  }
}

function renderPlan(d){
  const p=d.plan||{};
  const hf=p.hard_filters||{};
  let html='<div class="text-gold font-semibold mb-1.5">📋 搜尋計劃（SearchPlan）</div>';
  if(Object.keys(hf).length){
    html+='<div class="mb-1"><span class="text-dim">條件：</span>'+Object.entries(hf).map(([k,v])=>`<span class="px-1.5 py-0.5 rounded bg-gold/10 text-gold mr-1">${k}=${Array.isArray(v)?v.join('/'):v}</span>`).join('')+'</div>';
  }
  if(p.soft_preferences&&p.soft_preferences.length){
    html+='<div class="mb-1"><span class="text-dim">偏好（唔係硬性篩選）：</span><span class="text-info">'+p.soft_preferences.join('、')+'</span></div>';
  }
  if(p.unsupported_preferences&&p.unsupported_preferences.length){
    html+='<div class="mb-1"><span class="text-dim">REINS 做唔到（稍後用 AI 評估）：</span><span class="text-warn">'+p.unsupported_preferences.join('、')+'</span></div>';
  }
  if(p.clarification_needed&&p.clarification_needed.length){
    html+='<div class="mb-1"><span class="text-warn">💬 '+p.clarification_needed.join('；')+'</span></div>';
  }
  if(d.found!==undefined){
    html+='<div class="text-dim mt-1">REINS 搵到 '+d.found+' 件'+(d.hit_limit?'（已達 500 件顯示上限，建議收窄條件）':'')+'</div>';
  }
  return html;
}

function showReinsResults(results,d){
  const grid=document.getElementById('resultsGrid');

  const title=document.getElementById('resultsTitle');
  const count=document.getElementById('resultsCount');
  title.textContent='REINS 智能搜尋結果';
  count.textContent=`${results.length} 件（第 1 頁）`;

    grid.innerHTML='<div class="col-span-full text-center py-12 text-dim">冇符合條件嘅物件</div>';

    grid.innerHTML=results.map(l=>`
      <div class="block bg-surface-card border border-border rounded-2xl p-4 relative transition-all duration-300 hover:border-gold/50">
        <div class="flex items-center justify-between mb-2"><span class="text-sm font-bold text-gold">${esc(l.building_name||l.address||'')}</span><span class="text-[10px] text-dim">REINS</span></div>
        <div class="text-2xl font-bold mb-1">${(l.price||0).toLocaleString()}<span class="text-sm text-dim">万</span></div>
        <div class="text-xs text-dim mb-2">${esc(l.address||'')}</div>
        <div class="text-xs text-dim mb-2">${l.area?l.area+'m²':''} ${l.layout?esc(l.layout):''} ${l.floor?l.floor+'階':''}</div>

      </div>
    `).join('');

  section.classList.remove('hidden');
  section.scrollIntoView({behavior:'smooth',block:'start'});

async function importReinsItem(reinsId,drawing,btn){
  btn.disabled=true;btn.textContent='匯入中...';
  try{
    const r=await fetch('/api/collection/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'reins',items:[{reins_id:reinsId,drawing_available:drawing}]})});
    const d=await r.json();
    if(d.code===1){
      btn.textContent='已加入匯入佇列';
      // poll job 完成後俾 link
      pollNlImport(d.job_id,btn,reinsId);
    }else{
      btn.textContent='失敗: '+(d.error||'');btn.disabled=false;
    }
  }catch(e){btn.textContent='失敗';btn.disabled=false;}
}

async function pollNlImport(jobId,btn,reinsId){
  try{
    const r=await fetch('/api/collection/import-status/'+jobId);
    const d=await r.json();
    if(d.code!==1){btn.textContent='查詢失敗';return;}
    const it=(d.items||[])[0]||{};
    if(d.status==='running'){btn.textContent=`匯入中（${it.status||''}）...`;setTimeout(()=>pollNlImport(jobId,btn,reinsId),2000);return;}
    if(it.status==='success'||it.status==='partial'){
      btn.outerHTML=`<a href="/listing/${it.listing_id}" class="block w-full mt-1 text-center bg-good text-black text-xs font-bold px-3 py-2 rounded-lg">查看物件 →</a>`;
    }else{
      btn.textContent='失敗: '+(it.error||'');btn.disabled=false;
    }
  }catch(e){btn.textContent='失敗';btn.disabled=false;}
}

function riskBadge(level,label){
  const cls=level==='low'?'bg-good/10 text-good':level==='medium'?'bg-warn/10 text-warn':'bg-bad/10 text-bad';
  return `<span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${cls}">${label}</span>`;
}

// Valuation
function updateValuation(){
  const area=document.getElementById('valArea').value;
  const size=parseInt(document.getElementById('valSize').value)||60;
  const age=parseInt(document.getElementById('valAge').value)||15;
  const resultDiv=document.getElementById('valResult');
  const riskDiv=document.getElementById('riskResult');
  if(!area||!DATA.areas[area]){resultDiv.innerHTML='<div class="text-sm text-dim">請選擇地區</div>';riskDiv.innerHTML='<div class="text-sm text-dim">風險評估將顯示在此</div>';return;}
  const a=DATA.areas[area];
  const sqm=a.price_per_sqm_man;
  const ageFactor=Math.max(0.5,1-Math.max(0,age-5)*0.02);
  const estPrice=Math.round(sqm*size*ageFactor);
  const marketAvg=Math.round(sqm*size);
  const diff=estPrice-marketAvg;
  const diffPct=((diff/marketAvg)*100).toFixed(1);
  const areaAvgPrice=a.avg_price_man;
  const priceDiff=((estPrice-areaAvgPrice)/areaAvgPrice*100).toFixed(1);
  const monthlyRent=Math.round(estPrice*0.004/10)*10;
  const surfaceYield=((monthlyRent*12/estPrice)*100).toFixed(1);
  const netYield=(surfaceYield*0.78).toFixed(1);
  const areaRisk={'江東区':{flood:'high',earthquake:'low',liquefaction:'medium',tsunami:'medium'},'墨田区':{flood:'medium',earthquake:'medium',liquefaction:'medium',tsunami:'low'},'足立区':{flood:'medium',earthquake:'low',liquefaction:'low',tsunami:'low'},'葛飾区':{flood:'medium',earthquake:'low',liquefaction:'low',tsunami:'low'},'港区':{flood:'medium',earthquake:'low',liquefaction:'low',tsunami:'low'},'中央区':{flood:'medium',earthquake:'medium',liquefaction:'medium',tsunami:'low'}};
  const risk=areaRisk[area]||{flood:'low',earthquake:'low',liquefaction:'low',tsunami:'low'};
  resultDiv.innerHTML=`
    <div class="text-xs text-dim mb-1">AI 估價結果</div>
    <div class="text-3xl font-bold text-gold">${estPrice.toLocaleString()}<span class="text-sm text-dim">万</span></div>
    <div class="text-xs text-dim mt-1">基於 ${area} 平均 m2 單價 ${sqm}万 x ${size}m2 x 折舊係數 ${ageFactor.toFixed(2)}</div>
    <div class="flex items-center gap-2 mt-2 flex-wrap">
      <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${parseFloat(priceDiff)>0?'bg-bad/10 text-bad':'bg-good/10 text-good'}">vs 區平均 ${priceDiff}%</span>
      <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold bg-info/10 text-info">表面利回 ${surfaceYield}%</span>
      <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold bg-warn/10 text-warn">實質 ${netYield}%</span>
    </div>
    <div class="text-xs text-dim mt-2">預計月租: ${monthlyRent.toLocaleString()}万 - 同區平均成交價: ${areaAvgPrice.toLocaleString()}万</div>`;
  riskDiv.innerHTML=`
    <div class="text-xs text-dim mb-2">風險評估</div>
    <div class="space-y-2">${riskItem('洪水',risk.flood)}${riskItem('地震',risk.earthquake)}${riskItem('液状化',risk.liquefaction)}${riskItem('津波',risk.tsunami)}</div>
    <div class="text-xs text-dim mt-2">來源: 國土交通省 不動產情報Library</div>`;
}

function riskItem(label,level){
  const colors={low:'text-good',medium:'text-warn',high:'text-bad'};
  const labels={low:'低風險',medium:'中風險',high:'高風險'};
  return `<div class="flex items-center justify-between py-1"><span class="text-sm">${label}</span><span class="text-xs font-semibold ${colors[level]}">${labels[level]}</span></div>`;
}

// 市場情報 panel — 地產資訊（情報官報告日本房地產重點 + 地產新聞 RSS）
let _newsItems = [];
let _newsIdx = 0;
let _newsTimer = null;

function loadMarketIntel(){
  fetch('/api/market-news').then(r=>r.json()).then(d=>{
    const status=document.getElementById('intelStatus');
    if(!d || d.code!==1){status.textContent='暫無';return;}
    status.textContent = d.updated_at ? d.updated_at.slice(0,10) : '即時';
    const summary=document.getElementById('intelSummary');
    const escHtml = (s)=>{const div=document.createElement('div');div.textContent=s||'';return div.innerHTML;};
    let html='';
    if(d.highlights && d.highlights.length){
      html += '<div class="text-xs text-dim mb-1">日本房地產重點（情報官 '+escHtml(d.updated_at)+'）</div>';
      d.highlights.forEach(h=>{
        html += '<div class="text-xs text-muted leading-relaxed flex gap-1.5"><span class="text-gold flex-none">▪</span><span>'+escHtml(h)+'</span></div>';
      });
    }
    if(d.news && d.news.length){
      _newsItems = d.news;
      html += '<div class="mt-3 pt-3 border-t border-border">'
        + '<div class="text-[10px] text-dim mb-1.5">地產新聞</div>'
        + '<div id="newsTicker" class="text-xs text-gold leading-relaxed min-h-[2.5rem] transition-opacity duration-300"></div>'
        + '<div id="newsSource" class="text-[9px] text-dim mt-0.5"></div>'
        + '</div>';
    }
    summary.innerHTML = html;
    if(_newsItems.length){ _startNewsTicker(); }
  }).catch(()=>{
    document.getElementById('intelStatus').textContent='暫無';
  });
}

function _startNewsTicker(){
  if(_newsTimer) clearInterval(_newsTimer);
  const show = ()=>{
    const n = _newsItems[_newsIdx % _newsItems.length];
    const tick = document.getElementById('newsTicker');
    const src = document.getElementById('newsSource');
    if(!tick) return;
    tick.style.opacity = 0;
    setTimeout(()=>{
      tick.textContent = n.title;
      if(src) src.textContent = n.source;
      tick.style.opacity = 1;
    }, 300);
    _newsIdx++;
  };
  show();
  _newsTimer = setInterval(show, 3000);  // 3 秒滾動
}

// 天氣（Open-Meteo，免 key）— 用瀏覽器定位
const WMO_ZH = {0:'☀️ 天晴',1:'🌤 大致天晴',2:'⛅ 部分多雲',3:'☁️ 陰',45:'🌫 霧',48:'🌫 霧凇',51:'🌦 毛毛雨',53:'🌦 毛毛雨',55:'🌧 毛毛雨',61:'🌦 小雨',63:'🌧 中雨',65:'🌧 大雨',71:'🌨 小雪',73:'🌨 中雪',75:'❄️ 大雪',80:'🌦 驟雨',81:'🌧 驟雨',82:'⛈ 暴雨',95:'⛈ 雷雨',96:'⛈ 雷雹',99:'⛈ 雷雹'};
function loadWeather(){
  const el = document.getElementById('weatherChip');
  if(!el) return;
  if(!navigator.geolocation){ el.style.display='none'; return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lon=pos.coords.longitude;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`)
      .then(r=>r.json()).then(d=>{
        const c = d.current || {};
        const code = c.weather_code;
        el.textContent = `${WMO_ZH[code]||'🌡'} ${c.temperature_2m}°C`;
        el.title = `目前位置 (${lat.toFixed(2)},${lon.toFixed(2)})`;
        el.style.display = '';  // 成功攞到天氣先至顯示
      }).catch(()=>{ el.style.display='none'; });
  }, ()=>{ el.style.display='none'; }, {timeout:8000});
}
window.loadWeather = loadWeather;
