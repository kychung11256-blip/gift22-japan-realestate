<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圖片人工審核 | 管理系統</title><link rel="stylesheet" href="/config/commercial.css"><script src="/config/commercial.js"></script></head><body><header><a href="/workbench">出雲ランドエステー · 管理系統</a><nav><a id="usersLink" href="/admin/accounts" hidden>帳號及指派</a><button id="logout" class="secondary">登出</button></nav></header><main><h1>圖片人工審核</h1><p class="muted">原圖保持不變。請並排核實裁底後嘅圖片冇中介聯絡欄、電話或上游標識；批准只針對當前 derivative。唔會加品牌 overlay 或執行 OCR。</p><p id="status" role="status" aria-live="polite">確認權限中…</p><section id="workspace" class="review-layout" hidden><aside><h2>按物件分組</h2><div id="listings" class="review-list"></div></aside><div><div class="review-toolbar"><h2 id="listingTitle"></h2><div class="actions"><button id="prev" class="secondary">← 上一張</button><span id="position"></span><button id="next" class="secondary">下一張 →</button></div></div><p id="progressLabel"></p><progress id="progress" max="1" value="0"></progress><div id="asset"></div></div></section><dialog id="approveDialog"><h2>確認人工核實</h2><p>已完整查看目前 derivative，确认冇中介聯絡欄、電話、上游標識或其他不宜向客戶公開嘅內容？</p><p class="muted">只批准當前像素版本；重新生成後要重新審核。</p><div class="actions"><button id="confirmApprove">確認批准</button><button id="cancelApprove" class="secondary">返回檢查</button></div></dialog></main><script>
const $=id=>document.getElementById(id),esc=Commercial.esc;let listings=[],assets=[],listingId='',active=0,busy=false,loaded=false;
const label=v=>({needs_review:'待人工審核',customer_safe:'已批准客戶使用',internal_only:'僅供內部'}[v]||v);
function notice(text,error=false){$('status').textContent=text;$('status').className=error?'error':'notice';}
function scope(url,kind,a){try{const u=new URL(url,location.origin);const expected=`/api/admin/media-review/${kind}/${encodeURIComponent(listingId)}/${encodeURIComponent(a.asset_id)}`;return u.origin===location.origin&&u.pathname===expected?u.pathname:'';}catch{return '';}}
async function groups(){const d=await Commercial.api('/api/admin/media-review/listings');listings=d.listings||[];$('listings').innerHTML=listings.map(l=>`<button class="${l.id===listingId?'active':''}" data-id="${esc(l.id)}"><strong>${esc(l.address||l.id)}</strong><br><small>${l.customer_safe||0} 已批准 / ${l.needs_review||0} 待審 / ${l.total||0} 張</small></button>`).join('')||'<p>未有本地可審核圖片。</p>';$('listings').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!busy)selectListing(b.dataset.id);});}
async function selectListing(id,keep=false){loaded=false;listingId=id;if(!keep)active=0;$('asset').textContent='正在讀取圖片…';try{const d=await Commercial.api('/api/admin/media-review/listings/'+encodeURIComponent(id));assets=d.assets||[];active=Math.min(active,Math.max(0,assets.length-1));$('listingTitle').textContent=d.listing?.address||listings.find(l=>l.id===id)?.address||id;loaded=true;render();await groups();}catch(e){notice(e.message,true);$('asset').textContent='未能讀取圖片，請重新選擇物件。';}}
function render(){const a=assets[active],approved=assets.filter(x=>x.visibility==='customer_safe').length,pending=assets.filter(x=>x.visibility==='needs_review').length;$('progressLabel').textContent=`${approved} 已批准 · ${pending} 待審 · ${assets.length} 張`;$('progress').max=Math.max(assets.length,1);$('progress').value=assets.length-pending;$('position').textContent=assets.length?`${active+1} / ${assets.length}`:'0 / 0';$('prev').disabled=busy||!loaded||active===0;$('next').disabled=busy||!loaded||active>=assets.length-1;if(!a){$('asset').innerHTML='<div class="panel">此物件冇本地可審核圖片。</div>';return;}const orig=scope(a.original_preview_url,'image',a),deriv=scope(a.derivative_preview_url,'derivative',a),pct=a.manifest?.crop_bottom_pct??(a.category==='photo'?0:15);$('asset').innerHTML=`<p><strong>${esc(label(a.visibility))}</strong> · ${esc(a.category||'圖片')}<br><small>Asset ${esc(a.asset_id)}</small></p><div class="review-images"><figure>${orig?`<img id="originalImage" src="${esc(orig)}" alt="內部原圖">`:'<div class="placeholder">原圖暫不可預覽</div>'}<figcaption>原圖 · 僅供內部核實</figcaption></figure><figure>${deriv?`<img id="derivativeImage" src="${esc(deriv)}?v=${encodeURIComponent(a.derivative_fingerprint||'')}" alt="待核實 derivative">`:'<div class="placeholder">未生成 derivative</div>'}<figcaption>裁底後 derivative · ${esc(label(a.visibility))}</figcaption></figure></div><div class="panel"><label>裁走底部百分比（0–50%）<input id="crop" type="number" min="0" max="50" step="1" value="${Number(pct)||0}"></label><div class="actions"><button id="regenerate" ${busy?'disabled':''}>重新生成待審版本</button><button id="approve" ${busy||!deriv||!a.derivative_fingerprint||a.visibility!=='needs_review'?'disabled':''}>人工核實並批准</button><button id="reject" class="danger" ${busy?'disabled':''}>拒絕／只供內部</button></div><p class="muted">重新生成唔會批准；新 derivative 一律 needs_review。純室內／外觀相片可用 0% 保留完整圖片。</p></div>`;let originalReady=false,derivativeReady=false;const approve=$('approve');approve.disabled=true;for(const [id,kind] of [['originalImage','original'],['derivativeImage','derivative']]){const img=$(id);if(!img)continue;img.onload=()=>{if(kind==='original')originalReady=true;else derivativeReady=true;approve.disabled=busy||!originalReady||!derivativeReady||!a.derivative_fingerprint||a.visibility!=='needs_review';};img.onerror=()=>{img.className='failed';const msg=document.createElement('p');msg.textContent='圖片載入失敗，唔可以批准。';img.after(msg);approve.disabled=true;};if(img.complete&&img.naturalWidth)img.onload();}
$('regenerate').onclick=()=>{const value=Number($('crop').value);if(!Number.isFinite(value)||value<0||value>50)return notice('裁底百分比須為 0–50。',true);mutate('regenerate',{crop_bottom_pct:value});};$('approve').onclick=()=>$('approveDialog').showModal();$('reject').onclick=()=>{if(confirm('將此圖片設為僅供內部？'))mutate('reject');};}
async function mutate(action,data={}){if(busy||!loaded)return;const a=assets[active];if(!a)return;busy=true;render();notice(action==='regenerate'?'正在生成待審圖片…':'正在保存人工審核…');try{await Commercial.post(`/api/admin/media-review/${action}/${encodeURIComponent(listingId)}/${encodeURIComponent(a.asset_id)}`,data);await selectListing(listingId,true);notice(action==='regenerate'?'已生成新版本，請重新人工核實。':'審核狀態已保存。');}catch(e){notice(e.message,true);}finally{busy=false;render();}}
$('prev').onclick=()=>{if(!busy&&active>0){active--;render();}};$('next').onclick=()=>{if(!busy&&active<assets.length-1){active++;render();}};$('cancelApprove').onclick=()=>$('approveDialog').close();$('confirmApprove').onclick=()=>{const a=assets[active];$('approveDialog').close();if(a)mutate('approve',{derivative_fingerprint:a.derivative_fingerprint,confirmed:true});};$('logout').onclick=async()=>{try{await Commercial.post('/logout');location.href='/login/staff';}catch(e){notice(e.message,true);}};
(async()=>{try{const s=await Commercial.session();if(!['admin','agent'].includes(s.user?.role))throw Error('只供獲授權管理員／顧問存取。');$('usersLink').hidden=s.user.role!=='admin';$('workspace').hidden=false;await groups();if(listings[0])await selectListing(listings[0].id);notice('只顯示獲授權物件嘅已有本地圖片。');}catch(e){notice(e.message,true);}})();
</script></body></html>
