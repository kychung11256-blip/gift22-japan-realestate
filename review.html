<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>審核/編輯 | Johnny AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/vendor/phosphor/regular.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Geist', 'system-ui', 'sans-serif'] },
    colors: {
      gold: { DEFAULT: '#164d3d', light: '#23755b', dark: '#0f3f32', muted: 'rgba(22,77,61,0.12)' },
      surface: { DEFAULT: '#f4f6f3', card: '#ffffff', elevated: '#edf1ee' },
      border: { DEFAULT: '#dfe7e3', subtle: '#e8eeeb' },
      muted: '#68776f', dim: '#7c8984', good: '#36a77b', warn: '#c88a38', bad: '#a9573c', info: '#4f7c70',
    }
  }}
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f6f3; color: #fff; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #f4f6f3; }
  ::-webkit-scrollbar-thumb { background: #dfe7e3; border-radius: 2px; }
  .form-input { width: 100%; background: #f4f6f3; border: 1px solid #dfe7e3; border-radius: 10px; color: #fff; padding: 9px 12px; font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: #164d3d; }
  textarea.form-input { resize: vertical; min-height: 50px; }
  .bulk-bar { position: sticky; bottom: 0; z-index: 30; background: #edf1ee; border: 1px solid #164d3d; border-radius: 16px 16px 0 0; padding: 12px 24px; display: flex; align-items: center; gap: 16px; justify-content: center; box-shadow: 0 -4px 20px rgba(0,0,0,0.4); margin-top: 8px; }
  .bulk-bar.hidden { display: none; }
  .listing-check { width: 20px; height: 20px; border-radius: 5px; border: 2px solid #7c8984; background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .listing-check.checked { border-color: #164d3d; background: #164d3d; }
  .listing-check.checked::after { content: '✓'; color: #000; font-size: 12px; font-weight: 700; }
  .listing-check:hover { border-color: #164d3d; }
</style>
<link rel="stylesheet" href="/vendor/workbench-theme.css">
</head>
<body class="font-sans antialiased p-5">

<a href="/" class="inline-block text-xs text-dim hover:text-gold transition-colors duration-200 mb-1">← 首頁</a>
<div class="flex items-center gap-4 mb-5">
  <h1 class="text-xl font-bold text-gold">審核 / 編輯</h1>
  <div class="flex items-center gap-3 ml-auto">
    <div class="flex items-center gap-1 bg-surface-card border border-border rounded-lg p-0.5">
      <button id="btnDraft" class="px-3 py-1 text-xs rounded-md font-medium bg-gold-muted text-gold" onclick="switchTab('draft')">待審核</button>
      <button id="btnPublished" class="px-3 py-1 text-xs rounded-md font-medium text-dim" onclick="switchTab('published')">已發佈</button>
      <button id="btnLead" class="px-3 py-1 text-xs rounded-md font-medium text-dim" onclick="switchTab('lead')">線索</button>
    </div>
    <a href="/listings" class="text-xs text-dim hover:text-muted transition-colors duration-200">全部物件</a>
    <a href="/collection" class="text-xs text-dim hover:text-muted transition-colors duration-200">物件搜尋</a>
    <a href="/map" class="text-xs text-dim hover:text-muted transition-colors duration-200">地圖</a>
  </div>
</div>
<p class="text-sm text-dim mb-2" id="listCount">載入中...</p>

<div class="flex items-center gap-3 mb-3" id="selectAllRow" style="display:none">
  <button id="selectAllBtn" class="text-xs text-dim hover:text-gold transition-colors" onclick="toggleSelectAll()">全選</button>
</div>

<div class="text-sm text-center min-h-5" id="statusMsg"></div>
<div id="listContainer"></div>

<!-- Bulk Confirm Bar -->
<div id="bulkBar" class="bulk-bar hidden">
  <span class="text-sm text-gold font-semibold" id="bulkLabel">已選 0 件</span>
  <button id="bulkConfirmBtn" onclick="bulkConfirm()" class="bg-gold hover:bg-gold-dark text-black font-bold px-5 py-2 rounded-full text-sm transition-colors disabled:opacity-40 disabled:cursor-not-allowed">確認發布</button>
</div>

<div id="detailView" class="hidden fixed inset-0 z-50 bg-surface overflow-y-auto"></div>

<script>
const API = '/api';
let currentTab = 'draft';
let currentId = null;
let currentListings = [];
let selectedIds = new Set();

const FIELD_GROUPS = [
  {title:'基本情報',fields:[['address','地址','text'],['price','価格 (万円)','number'],['size_sqm','面積 (m2)','number'],['price_per_sqm','m2単価','number'],['room_layout','間取り','text'],['type','類型','text'],['age','築年数','number'],['built_date_full','建築日期','text'],['structure','構造','text'],['roof_type','屋根','text'],['floors_above','階数','number'],['orientation','朝向','text']]},
  {title:'交通',fields:[['station','車站','text'],['walk_min','步行 (分)','number']]},
  {title:'土地 / 建物',fields:[['land_area_sqm','土地面積 (m2)','number'],['land_area_tsubo','土地面積 (坪)','number'],['land_category','土地種類','text'],['land_rights','土地權利','text'],['ownership_type','所有権','text'],['building_coverage_ratio','建蔽率 (%)','number'],['floor_area_ratio','容積率 (%)','number'],['city_planning_zone','都市計画','text'],['use_district','用途地域','text'],['total_floor_area_sqm','延床面積 (m2)','number'],['total_floor_area_tsubo','延床面積 (坪)','number']]},
  {title:'取引情報',fields:[['current_status','現況','text'],['handover_timing','引渡時期','text'],['transaction_type','取引形態','text'],['commission_type','媒介形態','text'],['listing_agent_name','仲介業者','text'],['license_number','免許番号','text'],['brokerage_type','業種','text'],['yield_surface','表面利回 (%)','number'],['yield_net','實質利回 (%)','number']]},
  {title:'備考',fields:[['notes_freetext','備考','textarea']]},
];

function switchTab(tab) {
  currentTab = tab;
  selectedIds.clear();
  document.getElementById('btnDraft').className = tab === 'draft' ? 'px-3 py-1 text-xs rounded-md font-medium bg-gold-muted text-gold' : 'px-3 py-1 text-xs rounded-md font-medium text-dim';
  document.getElementById('btnPublished').className = tab === 'published' ? 'px-3 py-1 text-xs rounded-md font-medium bg-gold-muted text-gold' : 'px-3 py-1 text-xs rounded-md font-medium text-dim';
  document.getElementById('btnLead').className = tab === 'lead' ? 'px-3 py-1 text-xs rounded-md font-medium bg-gold-muted text-gold' : 'px-3 py-1 text-xs rounded-md font-medium text-dim';
  load();
}

async function load() {
  try {
    let endpoint;
    if (currentTab === 'draft') endpoint = '/drafts';
    else if (currentTab === 'lead') endpoint = '/listings/leads';
    else endpoint = '/listings';
    const r = await fetch(API + endpoint);
    const d = await r.json();
    currentListings = d.listings || [];
    const labelMap = { draft: '個 draft 待審核', published: '個已發佈物件', lead: '個初步線索' };
    document.getElementById('listCount').textContent = currentListings.length + (labelMap[currentTab] || '');

    // Show/hide select all row
    const selectAllRow = document.getElementById('selectAllRow');
    selectAllRow.style.display = currentTab === 'draft' && currentListings.length > 0 ? 'block' : 'none';

    if (currentListings.length === 0) {
      document.getElementById('listContainer').innerHTML = '<div class="text-center py-12 text-dim">沒有 listing</div>';
      updateBulkBar();
      return;
    }
    document.getElementById('listContainer').innerHTML = currentListings.map(l => {
      const mlitBadge = l.mlit_checked_at ? '<span class="ml-2 text-[9px] px-1.5 py-0.5 rounded-full bg-info/10 text-info border border-info/20">MLIT</span>' : '';
      const statusBadge = l.status === 'draft'
        ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-warn/10 text-warn font-semibold">draft</span>'
        : l.status === 'lead'
        ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-bad/10 text-bad font-semibold">待跟進</span>'
        : '<span class="text-[10px] px-2 py-0.5 rounded-full bg-good/10 text-good font-semibold">published</span>';
      const checkHtml = currentTab === 'draft'
        ? `<div class="listing-check ${selectedIds.has(l.id) ? 'checked' : ''}" onclick="event.stopPropagation(); toggleCheck('${l.id}')"></div>`
        : '';
      return `<div class="bg-surface-card border border-border rounded-2xl p-4 mb-2.5 cursor-pointer hover:border-gold transition-colors duration-200 flex items-center gap-3" onclick="openDetail('${l.id}')">
        ${checkHtml}
        <div class="flex justify-between items-center flex-1">
          <div>
            <div class="text-[10px] text-dim">${l.id} - ${l.source || 'mysok'}${mlitBadge}</div>
            <div class="text-sm font-bold mt-0.5">${l.address}</div>
            <div class="text-xs text-dim mt-0.5">${l.room_layout || ''} - ${l.size_sqm || 0}m2 - ${l.structure || ''}</div>
          </div>
          <div class="text-right">
            <div class="text-base font-bold text-gold">${(l.price || 0).toLocaleString()}万</div>
            ${statusBadge}
          </div>
        </div>
      </div>`;
    }).join('');

    updateBulkBar();
  } catch (e) {
    document.getElementById('listContainer').innerHTML = '<div class="text-center py-12 text-dim">' + e.message + '</div>';
  }
}

// ── Bulk Select ──

function toggleCheck(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  updateBulkBar();
  // Update visual
  const check = document.querySelector(`.listing-check[onclick*="${id}"]`);
  if (check) check.classList.toggle('checked', selectedIds.has(id));
}

function toggleSelectAll() {
  const allIds = currentListings.map(l => l.id);
  if (selectedIds.size === allIds.length) {
    selectedIds.clear();
  } else {
    allIds.forEach(id => selectedIds.add(id));
  }
  // Update visual checks
  document.querySelectorAll('.listing-check').forEach(el => {
    const onclick = el.getAttribute('onclick') || '';
    const idMatch = onclick.match(/'([^']+)'/);
    if (idMatch) el.classList.toggle('checked', selectedIds.has(idMatch[1]));
  });
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const count = selectedIds.size;
  document.getElementById('bulkLabel').textContent = `已選 ${count} 件`;
  document.getElementById('bulkConfirmBtn').textContent = `確認發布 ${count} 件`;
  document.getElementById('bulkConfirmBtn').disabled = count === 0;
  if (count > 0 && currentTab === 'draft') {
    bar.classList.remove('hidden');
  } else {
    bar.classList.add('hidden');
  }
  document.getElementById('selectAllBtn').textContent =
    (count === currentListings.length && currentListings.length > 0) ? '取消全選' : '全選';
}

// ── Bulk Confirm ──

async function bulkConfirm() {
  if (selectedIds.size === 0) return;
  const ids = [...selectedIds];
  const total = ids.length;
  let success = 0;
  let fail = 0;

  const btn = document.getElementById('bulkConfirmBtn');
  btn.disabled = true;

  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    showMsg(`發布中... ${i + 1} / ${total}`, 'info');
    try {
      const r = await fetch(API + '/confirm/' + id, { method: 'POST' });
      const d = await r.json();
      if (d.code === 1) {
        success++;
      } else {
        fail++;
      }
    } catch (e) {
      fail++;
    }
  }

  showMsg(`完成：${success} 成功 / ${fail} 失敗`, success > 0 ? 'success' : 'error');
  selectedIds.clear();
  btn.disabled = false;

  // Refresh list
  setTimeout(() => load(), 800);
}

async function openDetail(id) {
  currentId = id;
  const dv = document.getElementById('detailView');
  dv.innerHTML = '<div class="text-center py-12 text-dim">載入中...</div>';
  dv.classList.remove('hidden');
  try {
    const r = await fetch(API + '/listing/' + id);
    const l = await r.json();
    dv.innerHTML = renderDetail(l);
  } catch (e) {
    dv.innerHTML = '<div class="text-center py-12 text-dim">' + e.message + '</div>';
  }
}

function closeDetail() {
  document.getElementById('detailView').classList.add('hidden');
  currentId = null;
}

function renderMlitBadge(key, l) {
  const map = { building_coverage_ratio: 'mlit_coverage_ratio', floor_area_ratio: 'mlit_floor_area_ratio', use_district: 'mlit_use_district' };
  const mk = map[key] || '';
  if (!mk) return '';
  const mv = l[mk];
  if (!mv || mv === 0 || mv === '') return '<span class="ml-1.5 text-[10px] px-1.5 py-0.5 rounded-full bg-dim/10 text-dim border border-border">未核對</span>';
  const aiVal = l[key] || '';
  const match = String(aiVal).trim() === String(mv).trim();
  const cls = match ? 'bg-good/10 text-good border-good/20' : 'bg-bad/10 text-bad border-bad/20';
  const icon = match ? '\u2713' : '\u2717';
  return '<span class="ml-1.5 text-[10px] px-1.5 py-0.5 rounded-full border ' + cls + '">' + icon + ' 官方: ' + mv + '</span>';
}

function renderPhotos(lid, fp, ip) {
  let html = '<div class="bg-surface-card border border-border rounded-2xl p-4 mb-3"><h3 class="text-sm font-bold text-gold mb-3">相片 / 圖面</h3>';

  html += '<div class="mb-4"><div class="flex items-center justify-between mb-1.5"><span class="text-xs text-dim">平面圖 (' + fp.length + ')</span>';
  html += '<button class="text-[10px] px-2 py-0.5 rounded-full bg-gold-muted text-gold border border-gold/30 hover:bg-gold/20 transition-colors" onclick="triggerUpload(\'' + lid + '\',\'floorplan\')">+ 上傳</button></div>';
  html += '<input type="file" id="fu_floorplan" accept="image/*" class="hidden" onchange="uploadPhoto(\'' + lid + '\',\'floorplan\')">';
  if (fp.length === 0) {
    html += '<div class="text-xs text-dim py-1">暫無</div>';
  } else {
    html += '<div class="flex flex-wrap gap-2" id="fp_container">' + fp.map(f => '<div class="w-40 relative group"><img src="' + f.url + '" class="w-full h-48 object-contain rounded-lg bg-surface-elevated"><div class="text-[10px] text-dim text-center mt-1">' + (f.floor_label || '未標示') + '</div><button class="absolute top-1 right-1 w-5 h-5 rounded-full bg-bad/80 text-white text-[10px] leading-5 text-center opacity-0 group-hover:opacity-100 transition-opacity" onclick="deletePhoto(\'' + lid + '\',\'floorplan\',\'' + f.url + '\')">×</button></div>').join('') + '</div>';
  }
  html += '</div>';

  html += '<div><div class="flex items-center justify-between mb-1.5"><span class="text-xs text-dim">內觀寫真 (' + ip.length + ')</span>';
  html += '<button class="text-[10px] px-2 py-0.5 rounded-full bg-gold-muted text-gold border border-gold/30 hover:bg-gold/20 transition-colors" onclick="triggerUpload(\'' + lid + '\',\'interior\')">+ 上傳</button></div>';
  html += '<input type="file" id="fu_interior" accept="image/*" class="hidden" onchange="uploadPhoto(\'' + lid + '\',\'interior\')">';
  if (ip.length === 0) {
    html += '<div class="text-xs text-dim py-1">暫無</div>';
  } else {
    html += '<div class="flex flex-wrap gap-2" id="ip_container">' + ip.map(p => '<div class="w-36 relative group"><img src="' + p.url + '" class="w-full h-24 object-cover rounded-lg"><div class="text-[10px] text-dim text-center mt-1">' + (p.photo_category || '未分類') + ' / ' + (p.room_label || '') + '</div><button class="absolute top-1 right-1 w-5 h-5 rounded-full bg-bad/80 text-white text-[10px] leading-5 text-center opacity-0 group-hover:opacity-100 transition-opacity" onclick="deletePhoto(\'' + lid + '\',\'interior\',\'' + p.url + '\')">×</button><button class="absolute bottom-1 right-1 px-1.5 py-0.5 rounded-md bg-gold/90 text-black text-[9px] font-bold opacity-0 group-hover:opacity-100 transition-opacity" title="AI虛擬裝修/清空" onclick="openStagingModal(\'' + lid + '\',\'' + p.url + '\')">🎨 AI裝修預覽</button></div>').join('') + '</div>';
  }
  html += '</div></div>';
  return html;
}

function triggerUpload(lid, cat) {
  const el = document.getElementById('fu_' + cat);
  if (el) { el.value = ''; el.click(); }
}

async function uploadPhoto(lid, cat) {
  const el = document.getElementById('fu_' + cat);
  if (!el || !el.files[0]) return;
  const label = prompt(cat === 'floorplan' ? '樓層標示 (例: 1F, 2F):' : '相片分類 (例: 客廳, 廚房):', cat === 'floorplan' ? '' : '');
  if (label === null) return;
  const roomLabel = cat === 'interior' ? (prompt('房間標示:', '') || '') : '';
  if (roomLabel === null) return;

  const fd = new FormData();
  fd.append('file', el.files[0]);
  fd.append('category', cat);
  fd.append('label', label);
  if (cat === 'interior') fd.append('room_label', roomLabel);

  showMsg('上傳中...', 'info');
  try {
    const r = await fetch(API + '/upload-photo/' + lid, { method: 'POST', body: fd });
    const d = await r.json();
    if (d.code === 1) {
      showMsg('上傳成功', 'success');
      openDetail(lid);
    } else {
      showMsg(d.error || '上傳失敗', 'error');
    }
  } catch (e) { showMsg(e.message, 'error'); }
}

async function deletePhoto(lid, cat, url) {
  if (!confirm('確定刪除呢張相？')) return;
  showMsg('刪除中...', 'info');
  try {
    const r = await fetch(API + '/delete-photo/' + lid, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category: cat, url: url }) });
    const d = await r.json();
    if (d.code === 1) { showMsg('已刪除', 'success'); openDetail(lid); }
    else { showMsg(d.error || '失敗', 'error'); }
  } catch (e) { showMsg(e.message, 'error'); }
}

function renderDetail(l) {
  const fp = l.floorplan_images || [];
  const ip = l.interior_photos || [];

  let sourceLabel = l.source === 'mysok' ? 'マイソク' : (l.source === 'upload' ? '上傳' : l.source);
  if (l.source === 'akiya_bank') sourceLabel = '空き家バンク';
  let sourceClass = l.source === 'akiya_bank' ? 'bg-bad/10 text-bad border border-bad/20' : 'bg-info/10 text-info border border-info/20';

  let fieldsHtml = '';
  for (let g of FIELD_GROUPS) {
    fieldsHtml += '<div class="mb-4"><h3 class="text-xs font-bold text-gold mb-2 pb-1.5 border-b border-border-subtle">' + g.title + '</h3>';
    for (let [key, label, type] of g.fields) {
      let val = l[key];
      if (val === null || val === undefined) val = '';
      const badge = renderMlitBadge(key, l);
      if (type === 'textarea') {
        fieldsHtml += '<div class="mb-2"><label class="block text-[11px] text-dim mb-1">' + label + badge + '</label><textarea id="fld_' + key + '" class="form-input">' + val + '</textarea></div>';
      } else {
        fieldsHtml += '<div class="mb-2"><label class="block text-[11px] text-dim mb-1">' + label + badge + '</label><input id="fld_' + key + '" type="' + type + '" value="' + val + '" step="' + (type === 'number' ? 'any' : '') + '" class="form-input"></div>';
      }
    }
    fieldsHtml += '</div>';
  }

  const mlitChecked = l.mlit_checked_at || '';
  let disasterHtml = '';
  if (mlitChecked) {
    const items = [
      ['洪水', 'mlit_disaster_flood'], ['高潮', 'mlit_disaster_high_tide'],
      ['津波', 'mlit_disaster_tsunami'], ['土砂', 'mlit_disaster_landslide'],
    ];
    disasterHtml = '<div class="bg-surface-card border border-border rounded-2xl p-4 mb-3"><h3 class="text-sm font-bold text-gold mb-2">災害風險 (MLIT)</h3><div class="grid grid-cols-2 sm:grid-cols-4 gap-2">';
    for (let [label, key] of items) {
      const v = l[key] || '';
      const icon = v === 'false' ? '\u2713' : v === 'true' ? '\u26A0' : '?';
      const cls = v === 'false' ? 'text-good' : v === 'true' ? 'text-warn' : 'text-dim';
      disasterHtml += '<div class="bg-surface border border-border rounded-lg px-3 py-2 text-center"><div class="text-xs text-dim">' + label + '</div><div class="text-lg font-bold ' + cls + '">' + icon + '</div><div class="text-[10px] ' + cls + '">' + (v === 'true' ? '區域內' : '區域外') + '</div></div>';
    }
    disasterHtml += '</div></div>';
  }

  const mlitBadge = mlitChecked ? '<span class="text-[10px] text-info bg-info/10 px-1.5 py-0.5 rounded-full">MLIT核對済</span>' : '';

  return '<div class="max-w-5xl mx-auto p-5">' +
    '<div class="flex items-center justify-between mb-4">' +
      '<div>' +
        '<h2 class="text-lg font-bold text-gold">' + l.address + '</h2>' +
        '<div class="flex items-center gap-2 mt-1">' +
          '<span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ' + sourceClass + '">' + sourceLabel + '</span>' +
          '<span class="text-[11px] text-dim">ID: ' + l.id + '</span>' + mlitBadge +
        '</div>' +
      '</div>' +
      '<button onclick="closeDetail()" class="bg-transparent border border-border text-dim rounded-xl px-4 py-2 text-sm hover:border-gold hover:text-gold transition-colors duration-200">關閉</button>' +
    '</div>' +

    renderPhotos(l.id, fp, ip) +

    '<div class="bg-surface-card border border-border rounded-2xl p-4 mb-3 overflow-y-auto max-h-[70vh]">' + fieldsHtml + '</div>' +

    disasterHtml +

    '<div class="flex gap-3 flex-wrap">' +
      '<button onclick="saveFields()" class="flex-1 sm:flex-none bg-gold hover:bg-gold-dark text-black font-bold px-6 py-3 rounded-xl text-sm transition-colors duration-200 active:scale-[0.98]">保存修改</button>' +
      (l.status === 'draft'
        ? '<button onclick="confirmListing()" class="flex-1 sm:flex-none bg-good hover:bg-good/80 text-black font-bold px-6 py-3 rounded-xl text-sm transition-colors duration-200 active:scale-[0.98]">確認發布</button>'
        : '') +
      (l.status === 'lead'
        ? '<div class="flex-1 bg-bad/5 border border-bad/20 rounded-xl px-4 py-2 text-xs text-bad leading-relaxed">⚠ 初步線索 — 未經中介確認，唔可以當正式listing處理。請聯絡自治体/業主做後續確認。</div>'
        : '') +
      '<button onclick="deleteListingReview()" class="flex-1 sm:flex-none border border-bad/30 text-bad font-bold px-6 py-3 rounded-xl text-sm hover:bg-bad/10 hover:border-bad/60 transition-colors duration-200">刪除物件</button>' +
      '<button onclick="closeDetail()" class="flex-1 sm:flex-none bg-transparent border border-border text-dim font-bold px-6 py-3 rounded-xl text-sm hover:border-gold hover:text-gold transition-colors duration-200">取消</button>' +
    '</div>' +
  '</div>';
}

async function deleteListingReview() {
  if (!currentId) return;
  if (!confirm('確定要刪除呢筆 listing？此操作無法復原。')) return;
  try {
    const r = await fetch(API + '/listing/' + currentId, { method: 'DELETE' });
    const d = await r.json();
    if (d.code === 1) { alert('已刪除'); closeDetail(); load(); }
    else { alert('刪除失敗: ' + (d.error || 'unknown')); }
  } catch (e) { alert('失敗: ' + e.message); }
}

async function saveFields() {
  if (!currentId) return;
  const data = {};
  const numberFields = new Set(['price','size_sqm','price_per_sqm','age','walk_min','land_area_sqm','land_area_tsubo','building_coverage_ratio','floor_area_ratio','total_floor_area_sqm','total_floor_area_tsubo','yield_surface','yield_net','floors_above']);
  for (let g of FIELD_GROUPS) {
    for (let [key, , type] of g.fields) {
      const el = document.getElementById('fld_' + key);
      if (!el) continue;
      const v = el.value;
      if (type === 'number') {
        data[key] = v === '' ? 0 : parseFloat(v) || 0;
      } else {
        data[key] = v;
      }
    }
  }
  showMsg('保存中...', 'info');
  try {
    const r = await fetch(API + '/update/' + currentId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const d = await r.json();
    if (d.code === 1) { showMsg('已保存', 'success'); setTimeout(() => { closeDetail(); load(); }, 800); }
    else { showMsg(d.error || '失敗', 'error'); }
  } catch (e) { showMsg(e.message, 'error'); }
}

async function confirmListing() {
  if (!currentId) return;
  if (!confirm('發布後會出現在搜尋結果。確定？')) return;
  showMsg('發布中...', 'info');
  try {
    await saveFields();
    await new Promise(r => setTimeout(r, 300));
    const r = await fetch(API + '/confirm/' + currentId, { method: 'POST' });
    const d = await r.json();
    if (d.code === 1) { showMsg('已發布', 'success'); setTimeout(() => { closeDetail(); load(); }, 1500); }
    else { showMsg(d.error || '發布失敗', 'error'); }
  } catch (e) { showMsg(e.message, 'error'); }
}

function showMsg(msg, cls) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'text-sm text-center min-h-5 ' + (cls === 'success' ? 'text-good' : cls === 'error' ? 'text-bad' : 'text-gold');
}

/* ── AI Virtual Staging Modal ───────────────────────────── */
const STAGING_STYLES = [
  ['modern', '現代簡約'], ['nordic', '北歐'], ['wamodern', '和モダン'], ['hotel', 'ホテルライク']
];
const STAGING_ROOMS = [
  ['living', '客廳'], ['bedroom', '睡房'], ['kitchen', '廚房'],
  ['dining', '餐廳'], ['study', '書房'], ['ldk', 'LDK']
];
let stagingState = { lid: null, photoUrl: null, style: 'modern', mode: 'furnish', room: 'living', result: null };

function openStagingModal(lid, photoUrl) {
  stagingState = { lid, photoUrl, style: 'modern', mode: 'furnish', room: 'living', result: null };
  let modal = document.getElementById('stagingModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'stagingModal';
    modal.className = 'fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4';
    document.body.appendChild(modal);
  }
  renderStagingModal();
  modal.classList.remove('hidden');
}

function closeStagingModal() {
  const modal = document.getElementById('stagingModal');
  if (modal) modal.classList.add('hidden');
}

function stagingPick(field, value) {
  stagingState[field] = value;
  stagingState.result = null;
  renderStagingModal();
}

function renderStagingModal() {
  const modal = document.getElementById('stagingModal');
  const s = stagingState;
  const styleBtns = STAGING_STYLES.map(([k, label]) =>
    '<button onclick="stagingPick(\'style\',\'' + k + '\')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition-colors ' +
    (s.style === k ? 'bg-gold text-black border-gold' : 'bg-surface-elevated text-dim border-border hover:border-gold/50') + '">' + label + '</button>').join('');
  const modeBtns = [['furnish', '加家具'], ['clear', '清空家具']].map(([k, label]) =>
    '<button onclick="stagingPick(\'mode\',\'' + k + '\')" class="flex-1 px-3 py-2 rounded-lg text-xs font-semibold border transition-colors ' +
    (s.mode === k ? 'bg-gold text-black border-gold' : 'bg-surface-elevated text-dim border-border hover:border-gold/50') + '">' + label + '</button>').join('');
  const roomOpts = STAGING_ROOMS.map(([k, label]) =>
    '<option value="' + k + '"' + (s.room === k ? ' selected' : '') + '>' + label + '</option>').join('');

  let resultHtml = '';
  if (s.result) {
    if (s.result.error) {
      resultHtml = '<div class="mt-4 bg-bad/10 border border-bad/30 rounded-xl p-3 text-xs text-bad">' + s.result.error + '</div>';
    } else {
      resultHtml =
        '<div class="mt-4 grid grid-cols-2 gap-3">' +
          '<div><div class="text-[10px] text-dim mb-1">原始相片</div><img src="' + s.photoUrl + '" class="w-full h-40 object-cover rounded-lg border border-border"></div>' +
          '<div><div class="text-[10px] text-dim mb-1">AI效果圖（' + (s.result.elapsed_sec || '?') + 's）</div><img src="' + s.result.staged_url + '" class="w-full h-40 object-cover rounded-lg border border-gold/40"></div>' +
        '</div>' +
        '<div class="mt-3 flex gap-2">' +
          '<button onclick="acceptStaging()" class="flex-1 bg-good hover:bg-good/80 text-black font-bold py-2.5 rounded-xl text-sm transition-colors">✓ 接受（存入listing）</button>' +
          '<button onclick="runStaging()" class="flex-1 bg-gold hover:bg-gold-dark text-black font-bold py-2.5 rounded-xl text-sm transition-colors">↻ 重新生成</button>' +
        '</div>';
    }
  }

  modal.innerHTML =
    '<div class="bg-surface-card border border-border rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-5">' +
      '<div class="flex items-center justify-between mb-4">' +
        '<h3 class="text-sm font-bold text-gold">🎨 AI 虛擬裝修 / 清空</h3>' +
        '<button onclick="closeStagingModal()" class="w-7 h-7 rounded-full bg-surface-elevated border border-border text-dim hover:text-gold text-sm">✕</button>' +
      '</div>' +
      '<div class="mb-3"><img src="' + s.photoUrl + '" class="w-full h-44 object-cover rounded-lg border border-border"></div>' +
      '<div class="mb-3"><label class="block text-[11px] text-dim mb-1.5">房間類型</label>' +
        '<select onchange="stagingPick(\'room\',this.value)" class="form-input">' + roomOpts + '</select></div>' +
      '<div class="mb-3"><label class="block text-[11px] text-dim mb-1.5">風格</label><div class="flex flex-wrap gap-2">' + styleBtns + '</div></div>' +
      '<div class="mb-4"><label class="block text-[11px] text-dim mb-1.5">模式</label><div class="flex gap-2">' + modeBtns + '</div></div>' +
      (s.result ? '' : '<button id="stagingGenBtn" onclick="runStaging()" class="w-full bg-gold hover:bg-gold-dark text-black font-bold py-3 rounded-xl text-sm transition-colors">生成</button>') +
      '<div id="stagingProgress" class="hidden mt-3 text-center text-xs text-gold">生成中，請稍候（約 2 分鐘）...</div>' +
      resultHtml +
    '</div>';
}

async function runStaging() {
  const s = stagingState;
  const btn = document.getElementById('stagingGenBtn');
  if (btn) { btn.disabled = true; btn.classList.add('opacity-50'); }
  const prog = document.getElementById('stagingProgress');
  if (prog) prog.classList.remove('hidden');
  try {
    const r = await fetch(API + '/staging-generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ listing_id: s.lid, photo_url: s.photoUrl, room_type: s.room, style: s.style, mode: s.mode })
    });
    const d = await r.json();
    if (d.code === 1) {
      stagingState.result = d;
    } else {
      stagingState.result = { error: d.error || '生成失敗' };
    }
  } catch (e) {
    stagingState.result = { error: e.message };
  }
  renderStagingModal();
}

async function acceptStaging() {
  const s = stagingState;
  if (!s.result || !s.result.staged_url) return;
  try {
    const r = await fetch(API + '/staging-accept/' + s.lid, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        staged_url: s.result.staged_url,
        original_url: s.photoUrl,
        room_type: s.result.room_type, room_label: s.result.room_label,
        style: s.result.style, style_label: s.result.style_label,
        mode: s.result.mode
      })
    });
    const d = await r.json();
    if (d.code === 1) {
      showMsg('已存入 AI 效果圖（共 ' + d.total + ' 張）', 'success');
      closeStagingModal();
      openDetail(s.lid);
    } else {
      alert(d.error || '儲存失敗');
    }
  } catch (e) { alert(e.message); }
}

load();
</script>
</body>
</html>
