<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>安排睇樓 | Gift22 Workbench</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root{--ink:#12221d;--muted:#68776f;--line:#dfe7e3;--paper:#f4f6f3;--white:#fff;--green:#164d3d;--green2:#23755b;--mint:#dcebe4;--red:#a9573c;--shadow:0 18px 45px rgba(18,34,29,.09)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans HK","PingFang HK",system-ui,sans-serif;font-size:15px}.topbar{height:68px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.95);display:flex;align-items:center;gap:14px}.back{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:12px;padding:10px 13px;text-decoration:none;font-weight:800}.brand{min-width:0;flex:1}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--green2);font-weight:900}.brand h1{margin:2px 0 0;font-size:22px;line-height:1.1}.header-actions{display:flex;gap:8px;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;color:var(--muted);font-size:12px}.workspace{height:calc(100vh - 68px);display:grid;grid-template-columns:320px minmax(560px,1fr) 380px;gap:12px;padding:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:0;overflow:auto}.settings{padding:16px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.section-title h2{margin:0;font-size:16px}.muted{color:var(--muted)}label{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:700}input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#f8faf8;color:var(--ink);padding:10px 11px;font-size:15px;min-height:42px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;min-height:42px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#eaf2ee;color:var(--green)}.ghost{background:#fff;border:1px solid var(--line);color:var(--green)}.btn:disabled{opacity:.5;cursor:not-allowed}.shortlist{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}.item.disabled{opacity:.55}.item strong{display:block;font-size:14px}.item small{display:block;color:var(--muted);line-height:1.35}.warn{margin:8px 0;padding:10px;border-radius:12px;background:#fff7f2;border:1px solid #f0d2c4;color:var(--red);font-size:13px}.map-shell{position:relative;min-height:0;overflow:hidden}.map{width:100%;height:100%;min-height:420px;background:#dfe7e3}.map-status{position:absolute;left:12px;top:12px;z-index:2;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--green);box-shadow:0 8px 20px rgba(18,34,29,.08)}.map-status.warn{color:var(--red)}.map-fallback{height:100%;display:grid;place-content:center;text-align:center;padding:22px;color:var(--red)}.map-fallback button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:10px 14px;font-weight:800}.right{display:flex;flex-direction:column}.result{padding:16px;min-height:0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.summary div{border:1px solid var(--line);border-radius:14px;padding:12px;background:#f8faf8}.summary span{display:block;color:var(--muted);font-size:12px}.summary strong{display:block;color:var(--green);font-size:20px;margin-top:3px}.timeline{display:grid;gap:10px}.stop{display:grid;grid-template-columns:34px 1fr;gap:10px;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff}.seq{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:900}.stop h3{margin:0 0 4px;font-size:15px}.times{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.times span{background:var(--mint);border-radius:999px;padding:5px 8px;font-size:12px}.stop a{color:var(--green);font-weight:800;text-decoration:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.drawer-toggle{width:100%;margin:12px 0}.saved-list{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.saved-list.open{display:grid;gap:8px}.saved-card{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#f8faf8;padding:10px;color:var(--ink)}.saved-card strong{display:block}.share-box{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:11px;background:#f8faf8;word-break:break-all}.share-box a{color:var(--green);font-weight:800}.tabs{display:none}.sticky-action{display:none}.route-warning{border:1px solid #f0d2c4;background:#fff7f2;color:var(--red);border-radius:12px;padding:10px;margin:8px 0;font-size:13px}
    @media(max-width:900px){html,body{overflow:auto}.topbar{height:64px}.brand h1{font-size:18px}.header-actions .pill{display:none}.workspace{height:auto;min-height:calc(100vh - 64px);display:block;padding:0 0 74px}.tabs{height:46px;display:grid;grid-template-columns:repeat(3,1fr);position:sticky;top:64px;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.tabs button{border:0;background:#fff;color:var(--muted);font-weight:900}.tabs button.active{color:var(--green);border-bottom:3px solid var(--green)}.panel{border-radius:0;box-shadow:none;border-left:0;border-right:0}.settings,.result{display:none;padding:14px}.settings.active,.result.active{display:block}.map-shell{display:block;height:56vh;min-height:52vh;border:0}.map{height:100%;min-height:52vh}.row{grid-template-columns:1fr}.sticky-action{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:8}.sticky-action .btn{width:100%;box-shadow:0 14px 28px rgba(18,34,29,.22)}.actions{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.stop{grid-template-columns:30px 1fr}.seq{width:29px;height:29px}.mobile-hidden{display:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><a class="back" href="/workbench">← Workbench</a><div class="brand"><div class="eyebrow">VIEWING ROUTE WORKSPACE</div><h1 id="pageTitle">安排睇樓</h1></div><div class="header-actions"><span id="clientBadge" class="pill">讀取中…</span><button class="btn ghost mobile-hidden" id="reloadBtn">重載</button></div></header>
  <nav class="tabs"><button data-tab="settings" class="active">設定</button><button data-tab="map">地圖</button><button data-tab="result">行程</button></nav>
  <main class="workspace">
    <aside class="panel settings active" id="settingsPanel">
      <div class="section-title"><h2>設定</h2><span class="muted" id="selectedCount">0/8</span></div>
      <label>客戶<select id="clientSelect"></select></label>
      <div class="row"><label>日期<input id="routeDate" type="date"></label><label>出發時間<input id="routeTime" type="time" value="10:00"></label></div>
      <label>出發地點<input id="routeStartLabel" value="東京駅"></label>
      <div class="row"><label>出發緯度<input id="routeStartLat" type="number" step="0.000001" value="35.681236"></label><label>出發經度<input id="routeStartLon" type="number" step="0.000001" value="139.767125"></label></div>
      <label>終點（可留空＝返回出發點）<input id="routeEndLabel" placeholder="例：東京駅"></label>
      <div class="row"><label>終點緯度<input id="routeEndLat" type="number" step="0.000001" placeholder="預設同出發點"></label><label>終點經度<input id="routeEndLon" type="number" step="0.000001" placeholder="預設同出發點"></label></div>
      <div class="row"><label>交通模式<select id="routeMode"><option value="driving">駕車 / Taxi</option><option value="transit" disabled>公共交通自動規劃暫未支援</option></select></label><label>每間睇樓時間<select id="routeDuration"><option value="30">30 分鐘</option><option value="45" selected>45 分鐘</option><option value="60">60 分鐘</option></select></label></div>
      <div class="route-warning">公共交通自動規劃暫未支援。現有 Google Routes Provider 未提供日本公共交通路線，系統唔會估算時間或畫假路線。每段行程仍提供「Google Maps 公共交通」外部導航連結，由 Google Maps 即時提供，唔係平台內部計算結果。</div>
      <button class="btn primary" id="optimizeBtn">優化路線</button>
      <button class="btn secondary drawer-toggle" id="savedToggle">已儲存路線</button><div class="saved-list" id="savedList"></div>
      <div class="section-title" style="margin-top:14px"><h2>Shortlisted 物件</h2></div><div class="shortlist" id="shortlist">讀取中…</div>
    </aside>
    <section class="map-shell"><div id="mapStatus" class="map-status">載入 GSI 地圖…</div><div id="plannerMap" class="map"></div></section>
    <aside class="panel right result" id="resultPanel"><div id="routeResult"><div class="warn">未優化；會先顯示真實 GSI 底圖同 selected shortlist markers。不會顯示 CSS 假地圖。</div></div></aside>
  </main>
  <div class="sticky-action"><button class="btn primary" id="mobileOptimizeBtn">優化路線</button></div>
<script src="/viewing_route_map.js"></script>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=s=>s?new Date(s).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}):'—';
const price=v=>{if(!v)return '價格未填';const man=Math.round(Number(v)/10000);return man>=10000?(man/10000).toFixed(man%10000?1:0)+'億円':new Intl.NumberFormat('ja-JP').format(man)+'万円'};
const state={clients:[],clientId:new URLSearchParams(location.search).get('clientId')||'',planId:new URLSearchParams(location.search).get('planId')||'',items:[],plans:[],selected:new Set(),optimized:null,plan:null,map:null,errors:[]};
window.addEventListener('error',e=>state.errors.push(e.message));
async function api(url,options){const r=await fetch(url,options);const ct=(r.headers.get('content-type')||'').toLowerCase(),rid=r.headers.get('x-request-id')||'';let text='',d=null;if(ct.includes('application/json')){try{d=await r.json()}catch(e){throw new Error(`伺服器 JSON 格式錯誤（HTTP ${r.status}${rid?' · request '+rid:''}）`)}}else{text=await r.text().catch(()=>'');}if(!r.ok){if(d){const code=d.errorCode?` [${d.errorCode}]`:'';const req=d.requestId||rid;throw new Error(`${d.error||'請求失敗'}${code}${req?' · request '+req:''}`)}const sample=text?text.slice(0,140).replace(/\s+/g,' '):'空白回應';throw new Error(`伺服器回應不是 JSON（HTTP ${r.status} ${r.statusText||''}${rid?' · request '+rid:''}）：${sample}`)}if(!d){throw new Error(`伺服器成功但回應不是 JSON（HTTP ${r.status}${rid?' · request '+rid:''}）`)}return d}
function todayPlus(){const d=new Date(Date.now()+86400000);return d.toISOString().slice(0,10)}
function selectedItems(){return state.items.filter(x=>state.selected.has(x.id));}
function activePlan(){return state.plan||state.optimized||null;}
function markerPayload(){const plan=activePlan();if(plan)return {plan};return {start:{label:$('routeStartLabel').value,lat:Number($('routeStartLat').value),lon:Number($('routeStartLon').value)},selected:selectedItems()};}
function renderMap(){if(state.map)state.map.render(markerPayload());}
async function loadClients(){const d=await api('/api/v1/clients');state.clients=d.clients||[];const sel=$('clientSelect');sel.innerHTML=state.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}（${esc(c.shortlist_count||0)}）</option>`).join('');if(!state.clientId&&state.clients[0])state.clientId=state.clients[0].id;sel.value=state.clientId;sel.onchange=()=>{state.clientId=sel.value;history.replaceState(null,'',`/workbench/viewing-planner?clientId=${encodeURIComponent(state.clientId)}`);loadClientData();};}
async function loadClientData(){if(!state.clientId)return;const c=state.clients.find(x=>x.id===state.clientId);$('clientBadge').textContent=c?c.name:state.clientId;$('pageTitle').textContent='安排睇樓 — '+(c?c.name:'客戶');const [sl,pl]=await Promise.all([api(`/api/v1/shortlists/${encodeURIComponent(state.clientId)}`),api(`/api/v1/viewing-plans?clientId=${encodeURIComponent(state.clientId)}`)]);state.items=sl.items||[];state.plans=pl.plans||[];state.selected=new Set(state.items.filter(x=>x.routeEligible).slice(0,3).map(x=>x.id));if(state.planId){await openPlan(state.planId,false);state.planId='';}renderAll();}
function renderAll(){renderShortlist();renderSaved();renderResult();renderMap();}
function listingMeta(p){return [`ID ${p.id}`,price(p.priceYen),p.layout||'',p.floor?`${p.floor}F${p.totalFloors?' / '+p.totalFloors+'F':''}`:''].filter(Boolean).join(' · ')}
function renderShortlist(){ $('selectedCount').textContent=`${state.selected.size}/8`; $('shortlist').innerHTML=(state.items||[]).map(p=>`<label class="item ${p.routeEligible?'':'disabled'}"><input type="checkbox" data-pick="${esc(p.id)}" ${state.selected.has(p.id)?'checked':''} ${p.routeEligible?'':'disabled'}><div><strong>${esc(p.title)}</strong><small>${esc(listingMeta(p))}</small><small>${esc(p.address)} · ${esc(p.station||'')}</small>${p.routeEligible?'':'<div class="route-warning">缺少座標，不會估算或猜位置。</div>'}</div></label>`).join('')||'<div class="warn">呢個客戶未有 shortlist 房源</div>';document.querySelectorAll('[data-pick]').forEach(el=>el.onchange=()=>{if(el.checked)state.selected.add(el.dataset.pick);else state.selected.delete(el.dataset.pick);state.optimized=null;state.plan=null;renderAll();});}
function renderSaved(){const box=$('savedList');box.innerHTML=(state.plans||[]).map(p=>`<button class="saved-card" data-open-plan="${esc(p.id)}"><strong>${esc(p.viewingDate)} · ${esc(p.title)}</strong><small>${esc(p.travelMode==='transit'?'公共交通':'駕車')} · ${esc((p.stops||[]).length)} stops</small></button>`).join('')||'<div class="muted">未有已儲存路線</div>';box.querySelectorAll('[data-open-plan]').forEach(b=>b.onclick=()=>openPlan(b.dataset.openPlan,true));}
function renderResult(){const plan=activePlan();if(!plan){$('routeResult').innerHTML='<div class="warn">未優化；公共交通自動規劃暫未支援，系統唔會估時間或畫假路線。完成駕車 / Taxi 路線後，每段仍會提供 Google Maps 公共交通外部導航連結。</div>';return;}const stops=plan.stops||[],tot=plan.totals||plan,share=plan.shareUrl?`<div class="share-box"><strong>分享連結</strong><br><a href="${esc(plan.shareUrl)}" target="_blank">${esc(plan.shareUrl)}</a><div class="actions"><button class="btn secondary" id="routeRegen">更新分享</button><button class="btn ghost" id="routeRevoke">撤回</button></div></div>`:'';const geomWarn=(!plan.routeGeometry&&!plan.geometry)?'<div class="route-warning">Provider 未提供 route geometry；不會畫假路線，只顯示真實 map markers。</div>':'';$('routeResult').innerHTML=`<div class="summary"><div><span>總交通</span><strong>${esc(tot.totalTravelMinutes)} 分</strong></div><div><span>全程</span><strong>${esc(tot.totalItineraryMinutes)} 分</strong></div></div>${geomWarn}${(plan.warnings||[]).map(w=>`<div class="route-warning">${esc(w.message)}</div>`).join('')}<div class="timeline">${stops.map(s=>{const p=s.property||s;return `<article class="stop" draggable="true" data-stop-id="${esc(s.listingId)}"><div class="seq">${s.seq}</div><div><h3>${esc(p.title||p.address)}</h3><div class="muted">${esc(p.address||'')} · ${esc(p.station||'')}</div><div class="times"><span>出發 ${fmt(s.departAt)}</span><span>${esc(s.legTravelMode==='walking'?'步行':'交通')} ${esc(s.travelMinutes)} 分</span><span>到達 ${fmt(s.arriveAt)}</span><span>睇樓 ${fmt(s.viewingStartAt)}–${fmt(s.viewingEndAt)}</span></div><a href="/listing/${encodeURIComponent(s.listingId)}" target="_blank">物件詳情 ↗</a> · <a href="${esc(s.navigationUrl)}" target="_blank" rel="noopener">Google 駕車 / Taxi 導航 ↗</a><br><a href="${esc(s.transitNavigationUrl||s.navigationUrl)}" target="_blank" rel="noopener">Google Maps 公共交通（外部即時連結）↗</a><div class="muted">${esc(s.externalTransitNavigationNote||'此外部連結由 Google Maps 即時提供，唔係平台內部計算結果。')}</div></div></article>`}).join('')}</div><div class="actions"><button class="btn secondary" id="manualOrder">反轉重排</button><button class="btn primary" id="savePlan">保存 / 重開</button></div>${share}`;bindResult();}
function buildBody(manualOrder){return {clientId:state.clientId,listingIds:manualOrder||[...state.selected],manualOrder:manualOrder||[],viewingDate:$('routeDate').value,departureTime:$('routeTime').value,start:{label:$('routeStartLabel').value,lat:$('routeStartLat').value,lon:$('routeStartLon').value},end:{label:$('routeEndLabel').value,lat:$('routeEndLat').value,lon:$('routeEndLon').value},viewingDurationMin:Number($('routeDuration').value),travelMode:$('routeMode').value};}
async function optimize(manualOrder){try{$('optimizeBtn').disabled=true;$('mobileOptimizeBtn').disabled=true;const d=await api('/api/v1/viewing-plans/optimize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildBody(manualOrder))});state.optimized=d;state.plan=null;renderAll();activateTab('result');}catch(e){$('routeResult').innerHTML='<div class="warn">優化失敗：'+esc(e.message)+'</div>';renderMap();}finally{$('optimizeBtn').disabled=false;$('mobileOptimizeBtn').disabled=false;}}
async function savePlan(){const o=state.optimized;if(!o)return;const body=buildBody(o.listingIds);body.optimized=o;body.departureAt=o.departureAt;body.title=o.viewingDate+' 智慧睇樓路線';const d=await api('/api/v1/viewing-plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});state.plan=d.plan;state.optimized=null;state.plans=[d.plan,...state.plans.filter(p=>p.id!==d.plan.id)];history.replaceState(null,'',`/workbench/viewing-planner?clientId=${encodeURIComponent(state.clientId)}&planId=${encodeURIComponent(d.plan.id)}`);renderAll();}
async function openPlan(id,push){const d=await api('/api/v1/viewing-plans/'+encodeURIComponent(id));state.plan=d.plan;state.optimized=null;state.selected=new Set((d.plan.stops||[]).map(s=>s.listingId));if(push)history.replaceState(null,'',`/workbench/viewing-planner?clientId=${encodeURIComponent(state.clientId)}&planId=${encodeURIComponent(id)}`);renderAll();activateTab('result');}
async function shareAction(kind){if(!state.plan)return;const d=await api(`/api/v1/viewing-plans/${encodeURIComponent(state.plan.id)}/share`,{method:kind==='revoke'?'DELETE':'POST'});state.plan=d.plan;renderAll();}
function bindResult(){const mo=$('manualOrder'),sp=$('savePlan'),rr=$('routeRevoke'),rg=$('routeRegen');if(mo)mo.onclick=()=>{const ids=(activePlan()?.stops||[]).map(s=>s.listingId).reverse();optimize(ids)};if(sp)sp.onclick=savePlan;if(rr)rr.onclick=()=>shareAction('revoke');if(rg)rg.onclick=()=>shareAction('regen');}
function activateTab(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('settingsPanel').classList.toggle('active',t==='settings');$('resultPanel').classList.toggle('active',t==='result');setTimeout(()=>state.map&&state.map.resize(),80);} 
async function init(){ $('routeDate').value=todayPlus(); state.map=new Gift22ViewingRouteMap({container:'plannerMap',status:'mapStatus'}); await loadClients(); await loadClientData(); $('optimizeBtn').onclick=()=>optimize();$('mobileOptimizeBtn').onclick=()=>optimize();$('reloadBtn').onclick=()=>location.reload();$('savedToggle').onclick=()=>$('savedList').classList.toggle('open');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>activateTab(b.dataset.tab));['routeStartLat','routeStartLon','routeStartLabel'].forEach(id=>$(id).addEventListener('change',renderMap));}
window.__plannerDiagnostics=()=>({map:state.map?state.map.diagnostics():null,errors:state.errors,plan:activePlan()?{stops:activePlan().stops?.length,hasGeometry:!!(activePlan().routeGeometry||activePlan().geometry)}:null});
init().catch(e=>{$('routeResult').innerHTML='<div class="warn">讀取失敗：'+esc(e.message)+'</div>'});
</script>
</body>
</html>
