<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gift22 睇樓路線</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root{--ink:#12221d;--muted:#68776f;--line:#dfe7e3;--paper:#f4f6f3;--white:#fff;--green:#164d3d;--green2:#23755b;--mint:#dcebe4;--red:#a9573c;--shadow:0 18px 45px rgba(18,34,29,.09)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8faf8,#f2f5f2);color:var(--ink);font-family:Inter,"Noto Sans HK","PingFang HK",system-ui,sans-serif;font-size:15px}.topbar{height:64px;padding:10px max(4vw,18px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);display:flex;align-items:center}.brand{display:flex;gap:12px;align-items:center}.mark{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}.wrap{max-width:1180px;margin:0 auto;padding:22px max(4vw,16px) 70px}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.eyebrow{color:var(--green2);font-size:11px;letter-spacing:2px;font-weight:800}.hero h1{margin:8px 0 6px;font-size:clamp(26px,4vw,40px);letter-spacing:-1px}.muted{color:var(--muted)}.map-card{height:46vh;min-height:380px;border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;background:#dfe7e3;box-shadow:var(--shadow);margin:18px 0}.map{width:100%;height:100%}.map-status{position:absolute;left:12px;top:12px;z-index:2;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--green)}.map-status.warn{color:var(--red)}.map-fallback{height:100%;display:grid;place-content:center;text-align:center;color:var(--red);padding:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.summary div,.stop{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.summary strong{display:block;font-size:22px;color:var(--green)}.timeline{display:grid;gap:14px}.stop{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:start}.num{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}.times{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.times span{background:var(--mint);border-radius:999px;padding:7px 10px;font-size:12px}.nav{color:#fff;background:var(--green);border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:800}.warn{margin-top:14px;color:var(--red);background:#fff7f2;border:1px solid #f0d2c4;border-radius:14px;padding:12px}.error{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--red)}@media(max-width:720px){.summary{grid-template-columns:1fr}.stop{grid-template-columns:40px 1fr}.nav{grid-column:2}.wrap{padding-inline:12px}.hero{padding:18px}.map-card{height:54vh;min-height:360px;border-radius:16px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="mark">JP</span><div><strong>Gift22 睇樓路線</strong><div class="muted">只讀分享 · noindex/nofollow</div></div></div></header>
  <main class="wrap" id="app"><div class="hero"><span class="eyebrow">LOADING</span><h1>讀取路線中…</h1></div></main>
<script src="/viewing_route_map.js"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=s=>s?new Date(s).toLocaleString('zh-HK',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const price=v=>v?Math.round(v/10000).toLocaleString('ja-JP')+'万円':'—';
const errors=[];window.addEventListener('error',e=>errors.push(e.message));let routeMap=null,plan=null;
async function load(){
  const token=location.pathname.split('/').pop();
  const r=await fetch('/api/share/viewing/'+encodeURIComponent(token));
  const d=await r.json().catch(()=>({error:'回應格式錯誤'}));
  if(!r.ok){document.getElementById('app').innerHTML='<div class="error"><strong>分享連結無效或已撤回</strong><p>'+esc(d.error||'Not found')+'</p></div>';return}
  plan=d.plan;
  document.getElementById('app').innerHTML=`<section class="hero"><span class="eyebrow">CLIENT VIEWING ITINERARY</span><h1>${esc(plan.title||'睇樓路線')}</h1><p class="muted">${esc(plan.clientName)} · ${esc(plan.travelMode==='transit'?'公共交通':'駕車 / Taxi')} · 出發 ${fmt(plan.departureAt)}</p><div class="summary"><div><span class="muted">總交通</span><strong>${esc(plan.totals.totalTravelMinutes)} 分鐘</strong></div><div><span class="muted">全程需時</span><strong>${esc(plan.totals.totalItineraryMinutes)} 分鐘</strong></div><div><span class="muted">睇樓時間</span><strong>${esc(plan.viewingDurationMin)} 分鐘/間</strong></div></div><div class="warn">外部 Google Maps 公共交通連結由 Google Maps 即時提供，唔係平台內部計算結果；平台只顯示已保存嘅駕車 / Taxi 路線。</div>${(plan.warnings||[]).length?'<div class="warn">'+plan.warnings.map(w=>esc(w.message)).join('<br>')+'</div>':''}</section><section class="map-card"><div id="shareMapStatus" class="map-status">載入 GSI 地圖…</div><div id="shareMap" class="map"></div></section><section class="timeline">${plan.stops.map(s=>`<article class="stop"><div class="num">${s.seq}</div><div><h3>${esc(s.property.title)}</h3><p class="muted">${esc(s.property.address)} · ${esc(s.property.station||'')}</p><p><strong>${price(s.property.priceYen)}</strong> · ${esc(s.property.layout||'—')} · ${esc(s.property.areaSqm||'—')}㎡</p><div class="times"><span>交通 ${esc(s.travelMinutes)} 分鐘</span><span>到達 ${fmt(s.arriveAt)}</span><span>睇樓 ${fmt(s.viewingStartAt)}–${fmt(s.viewingEndAt)}</span></div><a href="${esc(s.property.url)}" target="_blank" rel="noopener">物件詳情</a><br><a href="${esc(s.transitNavigationUrl||s.navigationUrl)}" target="_blank" rel="noopener">Google Maps 公共交通（外部即時連結）</a><p class="muted">${esc(s.externalTransitNavigationNote||'此外部連結由 Google Maps 即時提供，唔係平台內部計算結果。')}</p></div><a class="nav" href="${esc(s.navigationUrl)}" target="_blank" rel="noopener">開始導航</a></article>`).join('')}</section>`;
  routeMap=new Gift22ViewingRouteMap({container:'shareMap',status:'shareMapStatus',readonly:true});
  setTimeout(()=>routeMap.render({plan}),250);
}
window.__shareDiagnostics=()=>({map:routeMap?routeMap.diagnostics():null,errors,hasGeometry:!!(plan&&(plan.routeGeometry||plan.geometry)),stops:plan?plan.stops.length:0});
load();
</script>
</body>
</html>
