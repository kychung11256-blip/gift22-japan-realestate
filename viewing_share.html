<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gift22 睇樓路線</title>
  <style>
    :root{--ink:#12221d;--muted:#68776f;--line:#dfe7e3;--paper:#f4f6f3;--white:#fff;--green:#164d3d;--green2:#23755b;--mint:#dcebe4;--red:#a9573c;--shadow:0 18px 45px rgba(18,34,29,.09)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8faf8,#f2f5f2);color:var(--ink);font-family:Inter,"Noto Sans HK","PingFang HK",system-ui,sans-serif}.topbar{padding:20px max(4vw,22px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.92)}.brand{display:flex;gap:12px;align-items:center}.mark{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}.wrap{max-width:1050px;margin:0 auto;padding:34px max(4vw,18px) 80px}.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.eyebrow{color:var(--green2);font-size:11px;letter-spacing:2px;font-weight:800}.hero h1{margin:10px 0 8px;font-size:clamp(28px,5vw,46px);letter-spacing:-1px}.muted{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.summary div,.stop{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.summary strong{display:block;font-size:22px;color:var(--green)}.timeline{display:grid;gap:14px;margin-top:22px}.stop{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:start}.num{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}.times{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.times span{background:var(--mint);border-radius:999px;padding:7px 10px;font-size:12px}.nav{color:#fff;background:var(--green);border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:800}.warn{margin-top:16px;color:var(--red);background:#fff7f2;border:1px solid #f0d2c4;border-radius:14px;padding:12px}.error{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--red)}@media(max-width:720px){.summary{grid-template-columns:1fr}.stop{grid-template-columns:42px 1fr}.nav{grid-column:2}.wrap{padding-inline:14px}.hero{padding:20px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="mark">JP</span><div><strong>Gift22 睇樓路線</strong><div class="muted">只讀分享 · 不公開收錄</div></div></div></header>
  <main class="wrap" id="app"><div class="hero"><span class="eyebrow">LOADING</span><h1>讀取路線中…</h1></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=s=>s?new Date(s).toLocaleString('zh-HK',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const price=v=>v?Math.round(v/10000).toLocaleString('ja-JP')+'万円':'—';
async function load(){
  const token=location.pathname.split('/').pop();
  const r=await fetch('/api/share/viewing/'+encodeURIComponent(token));
  const d=await r.json().catch(()=>({error:'回應格式錯誤'}));
  if(!r.ok){document.getElementById('app').innerHTML='<div class="error"><strong>分享連結無效或已撤回</strong><p>'+esc(d.error||'Not found')+'</p></div>';return}
  const p=d.plan;
  document.getElementById('app').innerHTML=`<section class="hero"><span class="eyebrow">CLIENT VIEWING ITINERARY</span><h1>${esc(p.title||'睇樓路線')}</h1><p class="muted">${esc(p.clientName)} · ${esc(p.travelMode==='transit'?'公共交通':'駕車 / Taxi')} · 出發 ${fmt(p.departureAt)}</p><div class="summary"><div><span class="muted">總交通</span><strong>${esc(p.totals.totalTravelMinutes)} 分鐘</strong></div><div><span class="muted">全程需時</span><strong>${esc(p.totals.totalItineraryMinutes)} 分鐘</strong></div><div><span class="muted">睇樓時間</span><strong>${esc(p.viewingDurationMin)} 分鐘/間</strong></div></div>${(p.warnings||[]).length?'<div class="warn">'+p.warnings.map(w=>esc(w.message)).join('<br>')+'</div>':''}</section><section class="timeline">${p.stops.map(s=>`<article class="stop"><div class="num">${s.seq}</div><div><h3>${esc(s.property.title)}</h3><p class="muted">${esc(s.property.address)} · ${esc(s.property.station||'')}</p><p><strong>${price(s.property.priceYen)}</strong> · ${esc(s.property.layout||'—')} · ${esc(s.property.areaSqm||'—')}㎡</p><div class="times"><span>交通 ${esc(s.travelMinutes)} 分鐘</span><span>到達 ${fmt(s.arriveAt)}</span><span>睇樓 ${fmt(s.viewingStartAt)}–${fmt(s.viewingEndAt)}</span></div><a href="${esc(s.property.url)}" target="_blank" rel="noopener">物件詳情</a></div><a class="nav" href="${esc(s.navigationUrl)}" target="_blank" rel="noopener">開始導航</a></article>`).join('')}</section>`;
}
load();
</script>
</body>
</html>
