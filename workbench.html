<head>

  <title>日本房源整理台 | Johnny AI</title>
  <style>
    :root{--ink:#12221d;--muted:#68776f;--line:#dfe7e3;--paper:#f4f6f3;--white:#fff;--green:#164d3d;--green2:#23755b;--mint:#dcebe4;--amber:#e8b869;--red:#a9573c;--shadow:0 18px 45px rgba(18,34,29,.09)}

er-radius:16px;padding:14px 4px;box-shadow:0 8px 24px rgba(18,34,29,.04)}.stats div{min-width:108px;padding:2px 22px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats strong{font-size:22px}.stats span{color:var(--muted);font-size:11px;margin-top:3px}.workspace{max-width:1520px;margin:auto;padding:0 max(4vw,28px) 140px}.searchbar{display:flex;gap:10px;align-items:center;background:white;border:1px solid var(--line);padding:10px;border-radius:16px;box-shadow:0 10px 30px rgba(18,34,29,.05)}.search-input{flex:1;min-width:250px;display:flex;align-items:center;gap:10px;padding:0 10px;color:#71817b}.search-input input{width:100%;border:0;outline:0;height:42px;background:transparent;color:var(--ink);font-size:14px}.area-tabs{display:flex;gap:3px;background:#f2f5f3;border-radius:11px;padding:3px}.area-tabs button{border:0;background:transparent;padding:9px 14px;color:#64726d;border-radius:8px;font-size:12px}.area-tabs button.active{background:white;color:var(--green);font-weight:750;box-shadow:0 2px 8px rgba(18,34,29,.08)}.filter-btn{height:42px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:11px;padding:0 16px;background:white;color:var(--ink);font-weight:650;font-size:13px}.filter-btn.active{color:var(--green);background:#eff6f2;border-color:#bcd5ca}.filter-panel{margin-top:10px;display:flex;align-items:end;gap:20px;padding:18px 20px;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 22px rgba(18,34,29,.04)}.filter-panel>label:not(.toggle){display:flex;flex-direction:column;gap:7px;min-width:160px}.filter-panel label>span{font-size:11px;color:var(--muted);font-weight:650}.filter-panel select,.results-head select{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 32px 9px 11px;outline:0;color:var(--ink);font-size:12px}.toggle{display:flex;align-items:center;gap:9px;margin-bottom:8px}.toggle input{display:none}.toggle i{width:3 x;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(12,29,23,.66);color:white;font-size:18px}.gallery-main{height:330px;position:relative;background:#e2e7e4}.gallery-main img{width:100%;height:100%;object-fit:cover}.gallery-main .no-photo{font-size:13px}.gallery-main span{position:absolute;left:16px;bottom:14px;background:rgba(12,29,23,.62);color:white;border-radius:7px;padding:6px 9px;font-size:9px}.thumbs{display:flex;gap:8px;padding:10px 16px;overflow:auto;border-bottom:1px solid var(--line)}.thumbs button{width:68px;height:48px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#ddd}.thumbs button.active{border-color:var(--green2)}.thumbs img{width:100%;height:100%;object-fit:cover}.drawer-content{padding:22px 25px}.drawer-kicker{display:flex;align-items:center;gap:10px;color:#7a8782;font-size:9px}.drawer-content h2{font-size:25px;margin:15px 0 7px;letter-spacing:-.5px}.location{color:var(--muted);font-size:11px;margin:0}.field-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;margin:22px 0;overflow:hidden}.field-grid>div{padding:12px;display:flex;flex-direction:column;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:65px}.field-grid>div:nth-child(4n){border-right:0}.field-grid>div:nth-child(n+5){border-bottom:0}.field-grid span{color:#798680;font-size:8px;margin-bottom:5px}.field-grid strong{font-size:11px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section-title h3{margin:0;font-size:13px}.review-box{margin-top:18px;background:#f4f8f5;border:1px solid #dce9e2;border-radius:12px;padding:14px}.review-box strong{font-size:11px}.review-box p{margin:5px 0 0;font-size:9px;color:var(--muted)}.map-link{display:inline-block;margin-top:14px;color:var(--green2);font-size:11px;text-decoration:none;font-weight:700}.drawer-footer{position:fixed;right:0;bottom:0;width:min(600px,100%);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:9px;justify-content:flex-end}.compare-overlay{display:grid;place-items:center;padding:25px}.compare-modal{width:min(1050px,100%);max-height:90vh;overflow:hidden;background:white;border-radius:18px;box-shadow:0 28px 80px rgba(5,24,17,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:21px 24px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:22px}.modal-head button{border:0;background:#eff3f1;width:36px;height:36px;border-radius:50%}.compare-scroll{overflow:auto;max-height:calc(90vh - 88px)}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px;text-align:left;font-size:11px;vertical-align:top}thead th{background:#f8faf8;min-width:210px}thead th:first-child,tbody th{width:130px;min-width:130px;color:var(--muted);font-weight:500}.toast{position:fixed;z-index:80;top:90px;left:50%;transform:translateX(-50%);color:white;background:#163b30;padding:10px 15px;border-radius:10px;font-size:11px;box-shadow:var(--shadow)}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.stats{display:none}.private-badge{font-size:0}.selected-list{display:none}}
    @media(max-width:700px){.topbar{height:auto;min-height:68px;padding:10px 16px;flex-wrap:wrap;gap:8px}.brand-copy{display:none}.mode-switch{order:3;width:100%}.mode-switch button{flex:1}.hero{padding:34px 18px 24px}.hero h1{font-size:34px}.hero p{font-size:12px}.workspace{padding:0 14px 130px}.searchbar{flex-wrap:wrap}.search-input{min-width:calc(100% - 56px);order:1}.filter-btn{order:2;width:46px;padding:0;justify-content:center;font-size:0}.area-tabs{order:3;width:100%}.area-tabs button{flex:1;padding:9px 5px}.filter-panel{align-items:stretch;flex-direction:column;gap:14px}.filter-panel>label:not(.toggle){width:100%}.reset{margin:0;text-align:left}.grid{grid-template-columns:1fr}.photo-wrap{height:245px}.compare-bar{bottom:12px;width:calc(100% - 24px)}.compare-mini{flex:1}.compare-bar>.primary{flex:1}.gallery-main{height:260px}.field-grid{grid-template-columns:repeat(2,1fr)}.field-grid>div:nth-child(2n){border-right:0}.field-grid>div:nth-child(n+5){border-bottom:1px solid var(--line)}.field-grid>div:nth-child(n+7){border-bottom:0}.compare-overlay{padding:8px}.compare-modal{max-height:96vh}thead th{min-width:190px}thead th:first-child,tbody th{width:90px;min-width:90px}}

<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">JP</span><span class="brand-copy"><strong>日本房源整理台</strong><small>JOHNNY AI · PROPERTY WORKBENCH</small></span></a>
    <div class="mode-switch"><button id="reviewMode" class="active">內部整理</button><button id="buyerMode">買家選盤</button></div>
    <div class="private-badge"><i></i>私有 · 登入保護</div>
  </header>

  <section class="hero">
    <div><span class="eyebrow" id="eyebrow">REVIEW WORKSPACE</span><h1 id="heroTitle">今日房源整理</h1><p id="heroCopy">集中檢查真實房源、圖片與主要欄位。</p></div>
    <div class="stats"><div><strong id="statTotal">—</strong><span>全部房源</span></div><div><strong id="statReview">—</strong><span>需要處理</span></div><div><strong id="statReady">—</strong><span>資料齊全</span></div></div>
  </section>

  <main class="workspace">
    <div class="searchbar">
      <label class="search-input"><span>⌕</span><input id="search" placeholder="搜尋大廈、地區、車站…"></label>
      <div class="area-tabs" id="areaTabs"><button data-area="" class="active">全部</button><button data-area="東京都">東京</button><button data-area="大阪府">大阪</button><button data-area="神奈川県">橫濱</button></div>
      <button class="filter-btn" id="filterBtn">☷ 篩選</button>
    </div>

    <div class="filter-panel hidden" id="filterPanel">
      <label><span>間隔</span><select id="layout"><option value="">全部</option><option>1LDK</option><option>2LDK</option><option>3LDK</option><option>4LDK</option></select></label>
      <label><span>最高售價</span><select id="maxPrice"><option value="0">不限</option><option value="100000000">1億円以下</option><option value="150000000">1.5億円以下</option><option value="200000000">2億円以下</option><option value="300000000">3億円以下</option><option value="500000000">5億円以下</option></select></label>
      <label><span>資料來源</span><select id="source"><option value="">全部</option><option value="reins">REINS</option><option value="suumo">SUUMO</option><option value="upload">手動上傳</option><option value="mysok">マイソク</option></select></label>
      <label class="toggle"><input id="completeOnly" type="checkbox"><i></i><span>只顯示 90% 以上完整資料</span></label>
      <button class="reset" id="reset">重設</button>
    </div>

    <div class="results-head"><div><h2>房源清單</h2><span id="resultCount">讀取中…</span></div><select id="sort"><option value="updated_desc">最近更新</option><option value="price_asc">售價：低至高</option><option value="price_desc">售價：高至低</option><option value="area_desc">面積：大至小</option><option value="completeness_desc">完整度：高至低</option></select></div>
    <div id="content" class="loading">正在讀取真實房源…</div>
  </main>

  <div class="compare-bar hidden" id="compareBar"><div class="compare-mini"><span>⇄</span><div><strong id="compareCount">已選 0 / 3</strong><small>並排比較重點欄位</small></div></div><div class="selected-list" id="selectedList"></div><button class="primary" id="compareNow">開始比較</button></div>
  <div class="overlay hidden" id="drawerOverlay"><aside class="drawer" id="drawer"></aside></div>
  <div class="overlay compare-overlay hidden" id="compareOverlay"><div class="compare-modal" id="compareModal"></div></div>
  <div class="toast hidden" id="toast"></div>

  <script>
    const state={items:[],filtered:[],mode:'review',area:'',selected:[],favorites:new Set(JSON.parse(localStorage.getItem('gift22-favorites')||'[]')),detail:null,activeImage:0};
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const yen=v=>v?new Intl.NumberFormat('ja-JP').format(v)+'円':'—';
    const price=v=>{if(!v)return '價格未填';const man=Math.round(v/10000);return man>=10000?(man/10000).toFixed(man%10000?1:0)+'億円':new Intl.NumberFormat('ja-JP').format(man)+'万円'};
    const pct=v=>Math.round((v||0)*100);
    const statusLabel=s=>({draft:'待審核',published:'已確認',archived:'已封存',lead:'線索'}[s]||s);
    const missingLabel=k=>({title:'名稱',address:'地址',station:'車站',priceYen:'售價',areaSqm:'面積',layout:'間隔',floor:'樓層',totalFloors:'總樓層',builtAt:'築年月',direction:'朝向',structure:'結構',images:'圖片'}[k]||k);
    const usableImages=p=>(p.images||[]).filter(x=>x.type!=='map'&&x.url);
    const mapImage=p=>(p.images||[]).find(x=>x.type==='map');

    function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)}
    async function api(url,options){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{d={error:'伺服器回應唔係 JSON'}}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
    async function load(){try{const [list,stats]=await Promise.all([api('/api/v1/properties?status=all&page_size=100'),api('/api/v1/property-stats')]);state.items=list.items||[];$('statTotal').textContent=stats.total??state.items.length;$('statReview').textContent=stats.needsReview??0;$('statReady').textContent=state.items.filter(x=>x.completeness>=.9).length;applyFilters()}catch(e){$('content').className='error-box';$('content').innerHTML='<strong>未能讀取房源</strong><br>'+esc(e.message)}}
    function applyFilters(){const q=$('search').value.trim().toLowerCase(),layout=$('layout').value,max=Number($('maxPrice').value),source=$('source').value,complete=$('completeOnly').checked;state.filtered=state.items.filter(p=>{const hay=[p.title,p.prefecture,p.city,p.ward,p.address,p.station,p.layout,p.structure,...(p.features||[])].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!state.area||p.address.includes(state.area))&&(!layout||p.layout.includes(layout))&&(!max||p.priceYen<=max)&&(!source||p.source===source)&&(!complete||p.completeness>=.9)});const sort=$('sort').value;state.filtered.sort((a,b)=>sort==='price_asc'?a.priceYen-b.priceYen:sort==='price_desc'?b.priceYen-a.priceYen:sort==='area_desc'?b.areaSqm-a.areaSqm:sort==='completeness_desc'?b.completeness-a.completeness:String(b.updatedAt).localeCompare(String(a.updatedAt)));render()}
    function render(){const root=$('content');$('resultCount').textContent=`${state.filtered.length} 個結果 · 真實資料`;if(!state.filtered.length){root.className='empty';root.innerHTML='<strong>搵唔到符合條件嘅房源</strong><span>試吓放寬售價、地區或完整度條件。</span>';return}root.className='grid';root.innerHTML=state.filtered.map(card).join('');root.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(el.dataset.open));root.querySelectorAll('[data-fav]').forEach(el=>el.onclick=e=>{e.stopPropagation();toggleFavorite(el.dataset.fav)});root.querySelectorAll('[data-compare]').forEach(el=>el.onchange=()=>toggleCompare(el.dataset.compare))}
    function card(p){const imgs=usableImages(p),img=imgs[0],fav=state.favorites.has(p.id),sel=state.selected.includes(p.id),unit=p.areaSqm?Math.round(p.priceYen/p.areaSqm):0;return `<article class="card"><div class="photo-wrap" data-open="${esc(p.id)}">${img?`<img src="${esc(img.url)}" alt="${esc(p.title)}" onerror="this.outerHTML='<div class=\'no-photo\'>圖片未能載入</div>'">`:'<div class="no-photo">暫未有圖片</div>'}<div class="source-row"><span class="source ${esc(p.source)}">${esc(p.source.toUpperCase())}</span><span class="image-count">▧ ${imgs.length}</span></div><button class="heart ${fav?'active':''}" data-fav="${esc(p.id)}">${fav?'♥':'♡'}</button><div class="shade"></div><div class="price-overlay"><strong>${esc(price(p.priceYen))}</strong><span>${unit?'約 '+esc(yen(unit))+'/㎡':''}</span></div></div><div class="card-body"><div class="title-row"><div><h3>${esc(p.title)}</h3><p>${esc([p.ward||p.city,p.station+(p.walkMinutes?' 徒步 '+p.walkMinutes+' 分鐘':'')].filter(Boolean).join(' · '))}</p></div><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span></div><div class="metrics"><span><b>${esc(p.layout||'—')}</b>間隔</span><span><b>${esc(p.areaSqm?p.areaSqm+'㎡':'—')}</b>專有</span><span><b>${esc(p.floor?p.floor+'F / '+(p.totalFloors||'—')+'F':'—')}</b>樓層</span></div><div class="features">${(p.features||[]).slice(0,3).map(f=>`<span>${esc(f)}</span>`).join('')}</div>${state.mode==='review'?`<div class="completeness"><div class="complete-head"><span>資料完整度</span><strong>${pct(p.completeness)}%</strong></div><div class="track"><i style="width:${pct(p.completeness)}%"></i></div>${p.missingFields.length?`<small>欠：${p.missingFields.map(missingLabel).map(esc).join('、')}</small>`:''}</div>`:''}<div class="card-actions"><label class="compare-check"><input type="checkbox" data-compare="${esc(p.id)}" ${sel?'checked':''}>加入比較</label><button class="open-btn" data-open="${esc(p.id)}">查看重點 ›</button></div></div></article>`}
    function toggleFavorite(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);localStorage.setItem('gift22-favorites',JSON.stringify([...state.favorites]));render()}
    function toggleCompare(id){if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else{if(state.selected.length>=3){toast('最多可同時比較 3 個房源');render();return}state.selected.push(id)}renderCompareBar();render()}
    function renderCompareBar(){const bar=$('compareBar');bar.classList.toggle('hidden',!state.selected.length);$('compareCount').textContent=`已選 ${state.selected.length} / 3`;$('selectedList').innerHTML=state.selected.map(id=>{const p=state.items.find(x=>x.id===id);return p?`<div><span>${esc(p.title)}</span></div>`:''}).join('')}
    function openDetail(id){state.detail=state.items.find(x=>x.id===id);state.activeImage=0;renderDrawer();$('drawerOverlay').classList.remove('hidden')}
    function renderDrawer(){const p=state.detail;if(!p)return;const imgs=usableImages(p),img=imgs[state.activeImage],map=mapImage(p),fields=[['售價',price(p.priceYen)],['專有面積',p.areaSqm?p.areaSqm+'㎡':'—'],['間隔',p.layout||'—'],['樓層',p.floor?`${p.floor}F / ${p.totalFloors||'—'}F`:'—'],['築年月',p.builtAt||'—'],['朝向',p.direction||'—'],['建築結構',p.structure||'—'],['管理費',yen(p.managementFeeYen)]];$('drawer').innerHTML=`<button class="drawer-close" id="closeDrawer">×</button><div class="gallery-main">${img?`<img src="${esc(img.url)}" alt="${esc(p.title)}">`:'<div class="no-photo">暫未有圖片</div>'}${imgs.length?`<span>${state.activeImage+1} / ${imgs.length}</span>`:''}</div>${imgs.length>1?`<div class="thumbs">${imgs.map((x,i)=>`<button data-thumb="${i}" class="${i===state.activeImage?'active':''}"><img src="${esc(x.url)}" alt=""></button>`).join('')}</div>`:''}<div class="drawer-content"><div class="drawer-kicker"><span class="source ${esc(p.source)}">${esc(p.source.toUpperCase())}</span><span>${esc(p.id)}</span><span>${esc(statusLabel(p.status))}</span></div><h2>${esc(p.title)}</h2><p class="location">${esc(p.address)} · ${esc(p.station)}${p.walkMinutes?' 徒步 '+p.walkMinutes+' 分鐘':''}</p><div class="field-grid">${fields.map(([k,v])=>`<div><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="section-title"><h3>物件重點</h3><span>${p.features.length} 項</span></div><div class="features">${p.features.map(f=>`<span>✓ ${esc(f)}</span>`).join('')||'<span>暫未有標籤</span>'}</div><div class="review-box"><strong>資料完整度 ${pct(p.completeness)}%</strong><p>${p.missingFields.length?'尚欠：'+p.missingFields.map(missingLabel).join('、'):'主要欄位及圖片已齊全'}</p><div class="track"><i style="width:${pct(p.completeness)}%"></i></div></div>${map?`<a class="map-link" href="${esc(map.url)}" target="_blank">在地圖查看 ↗</a>`:''}</div><div class="drawer-footer"><button class="secondary" id="drawerCompare">${state.selected.includes(p.id)?'移出比較':'加入比較'}</button>${state.mode==='review'&&p.status==='draft'?'<button class="primary" data-action="publish">確認並發布</button>':''}${state.mode==='review'&&p.status==='published'?'<button class="danger" data-action="archive">封存房源</button>':''}${state.mode==='review'&&p.status==='archived'?'<button class="secondary" data-action="draft">恢復待審</button>':''}</div>`;$('closeDrawer').onclick=closeDrawer;$('drawerCompare').onclick=()=>{toggleCompare(p.id);renderDrawer()};$('drawer').querySelectorAll('[data-thumb]').forEach(el=>el.onclick=()=>{state.activeImage=Number(el.dataset.thumb);renderDrawer()});$('drawer').querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>reviewAction(el.dataset.action))}
    function closeDrawer(){$('drawerOverlay').classList.add('hidden');state.detail=null}
    async function reviewAction(action){const labels={publish:'確認並發布',archive:'封存',draft:'恢復成待審'};if(!confirm(`確定要${labels[action]}呢個房源？`))return;try{const d=await api(`/api/v1/properties/${encodeURIComponent(state.detail.id)}/review`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});const idx=state.items.findIndex(x=>x.id===d.property.id);if(idx>=0)state.items[idx]=d.property;state.detail=d.property;toast('房源狀態已更新');applyFilters();renderDrawer()}catch(e){toast('操作失敗：'+e.message)}}
    function openCompare(){const items=state.selected.map(id=>state.items.find(x=>x.id===id)).filter(Boolean);if(items.length<2){toast('請最少揀 2 個房源');return}const rows=[['售價',p=>price(p.priceYen)],['所在地',p=>p.address],['交通',p=>p.station+(p.walkMinutes?' 徒步 '+p.walkMinutes+' 分鐘':'')],['間隔',p=>p.layout],['面積',p=>p.areaSqm+'㎡'],['樓層',p=>p.floor?`${p.floor}F / ${p.totalFloors||'—'}F`:'—'],['築年月',p=>p.builtAt],['管理費',p=>yen(p.managementFeeYen)],['完整度',p=>pct(p.completeness)+'%']];$('compareModal').innerHTML=`<div class="modal-head"><div><span class="eyebrow">PROPERTY COMPARE</span><h2>房源比較</h2></div><button id="closeCompare">×</button></div><div class="compare-scroll"><table><thead><tr><th>比較欄位</th>${items.map(p=>`<th><strong>${esc(p.title)}</strong></th>`).join('')}</tr></thead><tbody>${rows.map(([label,get])=>`<tr><th>${esc(label)}</th>${items.map(p=>`<td>${esc(get(p)||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;$('compareOverlay').classList.remove('hidden');$('closeCompare').onclick=()=>$('compareOverlay').classList.add('hidden')}
    function setMode(mode){state.mode=mode;$('reviewMode').classList.toggle('active',mode==='review');$('buyerMode').classList.toggle('active',mode==='buyer');$('eyebrow').textContent=mode==='review'?'REVIEW WORKSPACE':'BUYER DISCOVERY';$('heroTitle').textContent=mode==='review'?'今日房源整理':'揀出值得睇嘅房源';$('heroCopy').textContent=mode==='review'?'集中檢查真實房源、圖片與主要欄位。':'快速搜尋、收藏同時比較重點條件。';render()}
    $('reviewMode').onclick=()=>setMode('review');$('buyerMode').onclick=()=>setMode('buyer');$('filterBtn').onclick=()=>{$('filterPanel').classList.toggle('hidden');$('filterBtn').classList.toggle('active')};$('areaTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('areaTabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.area=b.dataset.area;applyFilters()});['search','layout','maxPrice','source','completeOnly','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',applyFilters));$('reset').onclick=()=>{$('layout').value='';$('maxPrice').value='0';$('source').value='';$('completeOnly').checked=false;applyFilters()};$('compareNow').onclick=openCompare;$('drawerOverlay').onclick=e=>{if(e.target===$('drawerOverlay'))closeDrawer()};$('compareOverlay').onclick=e=>{if(e.target===$('compareOverlay'))$('compareOverlay').classList.add('hidden')};load();
  </script>
</body>
