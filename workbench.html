<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">JP</span><span class="brand-copy"><strong>日本房源整理台</strong><small>JOHNNY AI · PROPERTY WORKBENCH</small></span></a>
    <div class="mode-switch"><button id="reviewMode" class="active">內部整理</button><button id="buyerMode">買家選盤</button></div>
    <div class="private-badge"><i></i>私有 · 登入保護</div>
  </header>

  <section class="hero">
    <div><span class="eyebrow" id="eyebrow">REVIEW WORKSPACE</span><h1 id="heroTitle">今日房源整理</h1><p id="heroCopy">集中檢查真實房源、圖片與主要欄位。</p></div>
    <div class="stats"><div><strong id="statTotal">—</strong><span>全部房源</span></div><div><strong id="statReview">—</strong><span>需要處理</span></div><div><strong id="statReady">—</strong><span>資料齊全</span></div></div>
  </section>

  <main class="workspace">
    <div class="searchbar">
      <label class="search-input"><span>⌕</span><input id="search" placeholder="搜尋大廈、地區、車站…"></label>
      <div class="area-tabs" id="areaTabs"><button data-area="" class="active">全部</button><button data-area="東京都">東京</button><button data-area="大阪府">大阪</button><button data-area="神奈川県">橫濱</button></div>
      <button class="filter-btn" id="filterBtn" aria-label="開啟篩選"><span class="filter-icon" aria-hidden="true">☷</span><span class="filter-label">篩選</span></button>
    </div>
    <div class="client-bar">
      <strong>客戶私人選盤</strong>
      <select id="clientFilter"><option value="">全部房源／未指定客戶</option></select>
      <small id="clientHint">建立或選擇客戶後，首頁搜尋結果可一鍵加入佢嘅私人房源。</small>
      <button id="newClient">＋ 新增客戶</button>
      <button id="arrangeViewing" class="secondary">安排睇樓</button>
    </div>

    <div class="filter-panel hidden" id="filterPanel">
      <label><span>間隔</span><select id="layout"><option value="">全部</option><option>1LDK</option><option>2LDK</option><option>3LDK</option><option>4LDK</option></select></label>
      <label><span>最高售價</span><select id="maxPrice"><option value="0">不限</option><option value="100000000">1億円以下</option><option value="150000000">1.5億円以下</option><option value="200000000">2億円以下</option><option value="300000000">3億円以下</option><option value="500000000">5億円以下</option></select></label>
      <label><span>資料來源</span><select id="source"><option value="">全部</option><option value="reins">REINS</option><option value="suumo">SUUMO</option><option value="upload">手動上傳</option><option value="mysok">マイソク</option></select></label>
      <label class="toggle"><input id="completeOnly" type="checkbox"><i></i><span>只顯示 90% 以上完整資料</span></label>
      <button class="reset" id="reset">重設</button>
    </div>

    <div class="results-head"><div><h2>房源清單</h2><span id="resultCount">讀取中…</span></div><select id="sort"><option value="updated_desc">最近更新</option><option value="price_asc">售價：低至高</option><option value="price_desc">售價：高至低</option><option value="area_desc">面積：大至小</option><option value="completeness_desc">完整度：高至低</option></select></div>
    <div id="content" class="loading">正在讀取真實房源…</div>
  </main>

  <div class="compare-bar hidden" id="compareBar"><div class="compare-mini"><span>⇄</span><div><strong id="compareCount">已選 0 / 3</strong><small>並排比較重點欄位</small></div></div><div class="selected-list" id="selectedList"></div><button class="primary" id="compareNow">開始比較</button></div>
  <div class="overlay hidden" id="drawerOverlay"><aside class="drawer" id="drawer"></aside></div>
  <div class="overlay compare-overlay hidden" id="compareOverlay"><div class="compare-modal" id="compareModal"></div></div>
  <div class="toast hidden" id="toast"></div>

  <script>
    const state={items:[],filtered:[],clients:[],activeClient:'',mode:'review',area:'',selected:[],favorites:new Set(JSON.parse(localStorage.getItem('gift22-favorites')||'[]')),detail:null,activeImage:0,reinsExtract:{lid:null,candidates:[],selected:new Set(),labels:{},active:0,error:''},stg:{lid:null,photoUrl:'',photos:[],room:'living',style:'modern',mode:'furnish',result:null},route:{client:null,items:[],plans:[],selected:new Set(),optimized:null,plan:null,dragId:null}};
    const REINS_ROOM_LABELS=['客廳','睡房','廚房','餐廳','書房','LDK','其他'];
    const STG_ROOMS=[['living','客廳'],['bedroom','睡房'],['kitchen','廚房'],['dining','餐廳'],['study','書房'],['ldk','LDK'],['other','其他']];
    const STG_STYLES=[['modern','現代簡約'],['nordic','北歐'],['wamodern','和モダン'],['hotel','ホテルライク']];
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const yen=v=>v?new Intl.NumberFormat('ja-JP').format(v)+'円':'—';
    const price=v=>{if(!v)return '價格未填';const man=Math.round(v/10000);return man>=10000?(man/10000).toFixed(man%10000?1:0)+'億円':new Intl.NumberFormat('ja-JP').format(man)+'万円'};
    const pct=v=>Math.round((v||0)*100);
    const statusLabel=s=>({draft:'待審核',published:'已確認',archived:'已封存',lead:'線索'}[s]||s);
    const missingLabel=k=>({title:'名稱',address:'地址',station:'車站',priceYen:'售價',areaSqm:'面積',layout:'間隔',floor:'樓層',totalFloors:'總樓層',builtAt:'築年月',direction:'朝向',structure:'結構',images:'圖片'}[k]||k);
    const usableImages=p=>(p.images||[]).filter(x=>x.type!=='map'&&x.url);
    const mapImage=p=>(p.images||[]).find(x=>x.type==='map');
    const originalStagingImages=p=>usableImages(p).filter(x=>['interior','exterior'].includes(x.type)).map(x=>x.url).filter(Boolean);

    function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)}
    async function api(url,options){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{d={error:'伺服器回應唔係 JSON'}}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
    async function load(){try{const [list,stats,clientData]=await Promise.all([api('/api/v1/properties?status=all&page_size=100'),api('/api/v1/property-stats'),api('/api/v1/clients')]);state.items=list.items||[];state.clients=clientData.clients||[];renderClients();$('statTotal').textContent=stats.total??state.items.length;$('statReview').textContent=stats.needsReview??0;$('statReady').textContent=state.items.filter(x=>x.completeness>=.9).length;applyFilters()}catch(e){$('content').className='error-box';$('content').innerHTML='<strong>未能讀取房源</strong><br>'+esc(e.message)}}
    function applyFilters(){const q=$('search').value.trim().toLowerCase(),layout=$('layout').value,max=Number($('maxPrice').value),source=$('source').value,complete=$('completeOnly').checked;state.filtered=state.items.filter(p=>{const hay=[p.title,p.prefecture,p.city,p.ward,p.address,p.station,p.layout,p.structure,...(p.features||[])].join(' ').toLowerCase();const assigned=(p.clientAssignments||[]).some(c=>c.id===state.activeClient);return(!q||hay.includes(q))&&(!state.area||p.address.includes(state.area))&&(!layout||p.layout.includes(layout))&&(!max||p.priceYen<=max)&&(!source||p.source===source)&&(!complete||p.completeness>=.9)&&(!state.activeClient||assigned)});const sort=$('sort').value;state.filtered.sort((a,b)=>sort==='price_asc'?a.priceYen-b.priceYen:sort==='price_desc'?b.priceYen-a.priceYen:sort==='area_desc'?b.areaSqm-a.areaSqm:sort==='completeness_desc'?b.completeness-a.completeness:String(b.updatedAt).localeCompare(String(a.updatedAt)));render()}
    function render(){const root=$('content');$('resultCount').textContent=`${state.filtered.length} 個結果 · 真實資料`;if(!state.filtered.length){root.className='empty';root.innerHTML='<strong>搵唔到符合條件嘅房源</strong><span>試吓放寬售價、地區或完整度條件。</span>';return}root.className='grid';root.innerHTML=state.filtered.map(card).join('');root.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(el.dataset.open));root.querySelectorAll('[data-fav]').forEach(el=>el.onclick=e=>{e.stopPropagation();toggleFavorite(el.dataset.fav)});root.querySelectorAll('[data-compare]').forEach(el=>el.onchange=()=>toggleCompare(el.dataset.compare))}
    function card(p){const imgs=usableImages(p),img=imgs[0],fav=state.favorites.has(p.id),sel=state.selected.includes(p.id),unit=p.areaSqm?Math.round(p.priceYen/p.areaSqm):0;return `<article class="card"><div class="photo-wrap" data-open="${esc(p.id)}">${img?`<img src="${esc(img.url)}" alt="${esc(p.title)}" onerror="this.outerHTML='<div class=\'no-photo\'>圖片未能載入</div>'">`:'<div class="no-photo">暫未有圖片</div>'}<div class="source-row"><span class="source ${esc(p.source)}">${esc(p.source.toUpperCase())}</span><span class="image-count">▧ ${imgs.length}</span></div><button class="heart ${fav?'active':''}" data-fav="${esc(p.id)}">${fav?'♥':'♡'}</button><div class="shade"></div><div class="price-overlay"><strong>${esc(price(p.priceYen))}</strong><span>${unit?'約 '+esc(yen(unit))+'/㎡':''}</span></div></div><div class="card-body"><div class="title-row"><div><h3>${esc(p.title)}</h3><p>${esc([p.ward||p.city,p.station+(p.walkMinutes?' 徒步 '+p.walkMinutes+' 分鐘':'')].filter(Boolean).join(' · '))}</p></div><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span></div><div class="metrics"><span><b>${esc(p.layout||'—')}</b>間隔</span><span><b>${esc(p.areaSqm?p.areaSqm+'㎡':'—')}</b>專有</span><span><b>${esc(p.floor?p.floor+'F / '+(p.totalFloors||'—')+'F':'—')}</b>樓層</span></div><div class="features">${(p.clientAssignments||[]).map(c=>`<span>客戶：${esc(c.name)}</span>`).join('')}${(p.features||[]).slice(0,3).map(f=>`<span>${esc(f)}</span>`).join('')}</div>${state.mode==='review'?`<div class="completeness"><div class="complete-head"><span>資料完整度</span><strong>${pct(p.completeness)}%</strong></div><div class="track"><i style="width:${pct(p.completeness)}%"></i></div>${p.missingFields.length?`<small>欠：${p.missingFields.map(missingLabel).map(esc).join('、')}</small>`:''}</div>`:''}<div class="card-actions"><label class="compare-check"><input type="checkbox" data-compare="${esc(p.id)}" ${sel?'checked':''}>加入比較</label><button class="open-btn" data-open="${esc(p.id)}">查看重點 ›</button></div></div></article>`}
    function toggleFavorite(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);localStorage.setItem('gift22-favorites',JSON.stringify([...state.favorites]));render()}
    function toggleCompare(id){if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else{if(state.selected.length>=3){toast('最多可同時比較 3 個房源');render();return}state.selected.push(id)}renderCompareBar();render()}
    function renderCompareBar(){const bar=$('compareBar');bar.classList.toggle('hidden',!state.selected.length);$('compareCount').textContent=`已選 ${state.selected.length} / 3`;$('selectedList').innerHTML=state.selected.map(id=>{const p=state.items.find(x=>x.id===id);return p?`<div><span>${esc(p.title)}</span></div>`:''}).join('')}
    function openDetail(id){state.detail=state.items.find(x=>x.id===id);state.activeImage=0;renderDrawer();$('drawerOverlay').classList.remove('hidden')}
    function renderDrawer(){
      const p=state.detail;if(!p)return;
      const imgs=usableImages(p),img=imgs[state.activeImage],map=mapImage(p),d=p.details||{};
      const originals=originalStagingImages(p);
      const canExtract=p.source==='reins'&&!!d.reinsDrawingPdf;
      const fields=[['售價',price(p.priceYen)],['專有面積',p.areaSqm?p.areaSqm+'㎡':'—'],['間隔',p.layout||'—'],['樓層',p.floor?`${p.floor}F / ${p.totalFloors||'—'}F`:'—'],['築年月',p.builtAt||'—'],['朝向',p.direction||'待確認'],['建築結構',p.structure||'—'],['管理費',yen(p.managementFeeYen)]];
      const complete=[
        ['物件類型',d.propertyType],['土地權利',d.landRights],['所有權類型',d.ownershipType],
        ['現況',d.currentStatus],['交付時期',d.handoverTiming],['交易形態',d.transactionType],
        ['佣金類型',d.commissionType],['修繕積立金',yen(d.repairReserveYen)],['露台面積',d.balconySqm?d.balconySqm+'㎡':''],
        ['總戶數',d.totalUnits],['管理公司',d.managementCompany],['管理形態',d.managementType],
        ['地下樓層',d.undergroundFloors],['用途地域',d.useDistrict],['城市規劃',d.cityPlanningZone],
        ['建蔽率',d.buildingCoverageRatio?d.buildingCoverageRatio+'%':''],['容積率',d.floorAreaRatio?d.floorAreaRatio+'%':''],
        ['登錄代理',d.listingAgentName],['牌照號碼',d.licenseNumber],['仲介類型',d.brokerageType]
      ].filter(([,v])=>v!==''&&v!==null&&v!==undefined&&v!==0);
      const docs=[['REINS 概要',d.reinsOverviewPdf],['REINS 圖面',d.reinsDrawingPdf]].filter(([,url])=>url);
      $('drawer').innerHTML=`<button class="drawer-close" id="closeDrawer">×</button>
        <div class="gallery-main">${img?`<img src="${esc(img.url)}" alt="${esc(p.title)}">`:'<div class="no-photo">暫未有圖片</div>'}${imgs.length?`<span>${state.activeImage+1} / ${imgs.length}</span>`:''}</div>
        ${imgs.length>1?`<div class="thumbs">${imgs.map((x,i)=>`<button data-thumb="${i}" class="${i===state.activeImage?'active':''}"><img src="${esc(x.url)}" alt=""></button>`).join('')}</div>`:''}
        <div class="drawer-content">
          <div class="drawer-kicker"><span class="source ${esc(p.source)}">${esc(p.source.toUpperCase())}</span><span>${esc(p.listingRoleLabel||'身份待確認')}</span><span>${esc(statusLabel(p.status))}</span></div>
          <h2>${esc(p.title)}</h2><p class="location">${esc(p.address)} · ${esc(p.station)}${p.walkMinutes?' 徒步 '+p.walkMinutes+' 分鐘':''}</p>
          <div class="field-grid">${fields.map(([k,v])=>`<div><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>
          <div class="section-title"><h3>完整房屋資料</h3><span>${complete.length} 項</span></div>
          <div class="field-grid">${complete.map(([k,v])=>`<div><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')||'<div><span>詳細資料</span><strong>待補充</strong></div>'}</div>
          ${d.notes?`<div class="review-box"><strong>備註</strong><p>${esc(d.notes)}</p></div>`:''}
          ${docs.length?`<div class="features">${docs.map(([k,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener">↗ ${esc(k)}</a>`).join('')}</div>`:''}
          ${canExtract?`<div class="review-box" id="reinsExtractBox"><strong>REINS 圖面相片提取</strong><p>本機解析 drawing PDF，預設只揀 interior_photo；composite_page / 平面圖候選會排除。確認前不寫入 DB，亦不會自動生成 AI 圖。</p><button class="primary" id="reinsExtractBtn">從 REINS 圖面提取相片</button></div>`:''}
          <div class="review-box" id="aiWorkbenchBox"><strong>AI 虛擬裝修原始相片</strong><p>${originals.length?`可揀 ${originals.length} 張原始/室內相片；生成只會喺你按「生成」後呼叫。`:'暫無可用內觀相片；如屬 REINS 圖面，可先提取室內相片。'}</p>${originals.length?`<div class="thumbs">${originals.map((u,i)=>`<button data-ai-photo="${esc(u)}"><img src="${esc(u)}" alt="AI original ${i+1}"></button>`).join('')}</div><button class="secondary" id="openStgEmpty">開啟 AI 相片選擇</button>`:''}</div>
          <div class="section-title"><h3>物件重點</h3><span>${(p.features||[]).length} 項</span></div>
          <div class="features">${(p.features||[]).map(f=>`<span>✓ ${esc(f)}</span>`).join('')||'<span>暫未有標籤</span>'}</div>
          <div class="review-box"><strong>資料完整度 ${pct(p.completeness)}%</strong><p>${p.missingFields.length?'尚欠：'+p.missingFields.map(missingLabel).join('、'):'主要欄位及圖片已齊全'}</p><div class="track"><i style="width:${pct(p.completeness)}%"></i></div></div>
          <div class="features"><a href="/listing/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">開啟完整物件頁 ↗</a>${map?`<a href="${esc(map.url)}" target="_blank" rel="noopener">在地圖查看 ↗</a>`:''}</div>
        </div>
        <div class="drawer-footer"><button class="secondary" id="drawerCompare">${state.selected.includes(p.id)?'移出比較':'加入比較'}</button>${state.mode==='review'&&p.status==='draft'?'<button class="primary" data-action="publish">確認並發布</button>':''}${state.mode==='review'&&p.status==='published'?'<button class="danger" data-action="archive">封存房源</button>':''}${state.mode==='review'&&p.status==='archived'?'<button class="secondary" data-action="draft">恢復待審</button>':''}</div>`;
      $('closeDrawer').onclick=closeDrawer;$('drawerCompare').onclick=()=>{toggleCompare(p.id);renderDrawer()};
      $('drawer').querySelectorAll('[data-thumb]').forEach(el=>el.onclick=()=>{state.activeImage=Number(el.dataset.thumb);renderDrawer()});
      $('drawer').querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>reviewAction(el.dataset.action));
      const extractBtn=$('reinsExtractBtn');if(extractBtn)extractBtn.onclick=()=>openReinsExtractModal(p.id);
      const stgEmpty=$('openStgEmpty');if(stgEmpty)stgEmpty.onclick=()=>openStagingModal(p.id,'');
      $('drawer').querySelectorAll('[data-ai-photo]').forEach(el=>el.onclick=()=>openStagingModal(p.id,el.dataset.aiPhoto));
    }
    function closeDrawer(){$('drawerOverlay').classList.add('hidden');state.detail=null}
    async function reviewAction(action){const labels={publish:'確認並發布',archive:'封存',draft:'恢復成待審'};if(!confirm(`確定要${labels[action]}呢個房源？`))return;try{const d=await api(`/api/v1/properties/${encodeURIComponent(state.detail.id)}/review`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});const idx=state.items.findIndex(x=>x.id===d.property.id);if(idx>=0)state.items[idx]=d.property;state.detail=d.property;toast('房源狀態已更新');applyFilters();renderDrawer()}catch(e){toast('操作失敗：'+e.message)}}
    async function refreshDetail(id){const p=await api(`/api/v1/properties/${encodeURIComponent(id)}`);const idx=state.items.findIndex(x=>x.id===p.id);if(idx>=0)state.items[idx]=p;state.detail=p;applyFilters();renderDrawer();return p}
    function ensureModal(id,z=60){let m=$(id);if(!m){m=document.createElement('div');m.id=id;m.className='overlay';m.style.zIndex=z;document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.classList.add('hidden')}}return m}
    async function openReinsExtractModal(lid){state.reinsExtract={lid,candidates:[],selected:new Set(),labels:{},active:0,error:''};const m=ensureModal('reinsExtractModal',80);m.innerHTML='<div class="compare-modal"><div class="modal-head"><div><span class="eyebrow">REINS PHOTO EXTRACTION</span><h2>REINS 圖面相片提取</h2></div><button data-close>×</button></div><div class="loading">本機解析 drawing PDF 中...</div></div>';m.classList.remove('hidden');m.querySelector('[data-close]').onclick=()=>m.classList.add('hidden');try{const d=await api(`/api/reins-photo-preview/${encodeURIComponent(lid)}`,{method:'POST'});state.reinsExtract.candidates=d.candidates||[];state.reinsExtract.selected=new Set(state.reinsExtract.candidates.filter(c=>!c.excluded&&c.classification==='interior_photo').map(c=>c.id));state.reinsExtract.labels={};state.reinsExtract.candidates.forEach(c=>state.reinsExtract.labels[c.id]='其他')}catch(e){state.reinsExtract.error=e.message}renderReinsExtractModal()}
    function renderReinsExtractModal(){const m=ensureModal('reinsExtractModal',80),s=state.reinsExtract,c=s.candidates||[],active=c[s.active]||c[0];if(s.error){m.innerHTML=`<div class="compare-modal"><div class="modal-head"><div><span class="eyebrow">REINS PHOTO EXTRACTION</span><h2>提取失敗</h2></div><button data-close>×</button></div><div class="error-box">${esc(s.error)}</div></div>`;m.querySelector('[data-close]').onclick=()=>m.classList.add('hidden');return}const cards=c.map((x,i)=>{const disabled=x.excluded||x.classification!=='interior_photo',checked=s.selected.has(x.id);const opts=REINS_ROOM_LABELS.map(l=>`<option value="${esc(l)}" ${(s.labels[x.id]||'其他')===l?'selected':''}>${esc(l)}</option>`).join('');return `<div class="card" style="box-shadow:none;padding:8px;border-color:${i===s.active?'var(--green)':'var(--line)'}"><img src="${esc(x.url)}" data-reins-active="${i}" style="width:100%;height:105px;object-fit:cover;border-radius:10px;cursor:pointer"><label style="display:flex;gap:8px;align-items:center;font-size:12px;margin:8px 0;color:${disabled?'var(--muted)':'var(--ink)'}"><input type="checkbox" data-reins-toggle="${esc(x.id)}" ${checked?'checked':''} ${disabled?'disabled':''}>選取</label><select data-reins-label="${esc(x.id)}" ${disabled?'disabled':''} style="width:100%;border:1px solid var(--line);border-radius:9px;padding:7px;background:white">${opts}</select><small style="display:block;margin-top:7px;color:var(--muted)">頁 ${esc(x.page)} · ${esc(x.classification)} · Q${esc(x.quality)}</small><small style="display:block;color:${disabled?'var(--red)':'var(--green2)'}">${esc(x.reason||'室內相片候選')}</small></div>`}).join('');m.innerHTML=`<div class="compare-modal"><div class="modal-head"><div><span class="eyebrow">REINS PHOTO EXTRACTION</span><h2>候選相片選擇</h2><p style="color:var(--muted);font-size:12px;margin-top:6px">預設只選 interior_photo；composite_page 不可確認。確認前不寫入 DB。</p></div><button data-close>×</button></div>${c.length?`<div style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px"><div class="gallery-main" style="height:auto;min-height:300px;display:grid;place-items:center"><img src="${esc(active.url)}" style="max-width:100%;max-height:58vh;object-fit:contain"></div><div><strong style="font-size:13px">候選 ${c.length} 張 · 已選 ${s.selected.size} 張</strong><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:58vh;overflow:auto;margin-top:10px">${cards}</div></div></div>`:'<div class="empty">沒有可提取候選</div>'}<div style="display:flex;gap:12px;margin-top:16px"><button class="primary" id="confirmReinsExtract" ${s.selected.size?'':'disabled'}>確認保存為 interior_photos</button><button class="secondary" data-close2>取消</button></div></div>`;m.querySelector('[data-close]').onclick=()=>m.classList.add('hidden');m.querySelector('[data-close2]').onclick=()=>m.classList.add('hidden');m.querySelectorAll('[data-reins-active]').forEach(el=>el.onclick=()=>{s.active=Number(el.dataset.reinsActive);renderReinsExtractModal()});m.querySelectorAll('[data-reins-toggle]').forEach(el=>el.onchange=()=>{el.checked?s.selected.add(el.dataset.reinsToggle):s.selected.delete(el.dataset.reinsToggle);renderReinsExtractModal()});m.querySelectorAll('[data-reins-label]').forEach(el=>el.onchange=()=>{s.labels[el.dataset.reinsLabel]=el.value});$('confirmReinsExtract').onclick=confirmReinsExtraction}
    async function confirmReinsExtraction(){const s=state.reinsExtract;try{const candidates=[...s.selected].map(id=>({id,room_label:s.labels[id]||'其他'}));const d=await api(`/api/reins-photo-confirm/${encodeURIComponent(s.lid)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidates})});$('reinsExtractModal').classList.add('hidden');toast(`已保存 ${d.confirmed} 張室內相片`);await refreshDetail(s.lid)}catch(e){toast('保存失敗：'+e.message)}}
    function openStagingModal(lid,photoUrl){const p=state.detail||state.items.find(x=>x.id===lid)||{},photos=originalStagingImages(p);state.stg={lid,photoUrl:photoUrl||photos[0]||'',photos,room:'living',style:'modern',mode:'furnish',result:null};const m=ensureModal('stagingModal',90);m.classList.remove('hidden');renderStagingModal()}
    function stgPick(k,v){state.stg[k]=v;state.stg.result=null;renderStagingModal()}
    function renderStagingModal(){const m=ensureModal('stagingModal',90),s=state.stg;const photos=s.photos.map(u=>`<button data-stg-photo="${esc(u)}" class="${s.photoUrl===u?'active':''}"><img src="${esc(u)}" alt=""></button>`).join('');const rooms=STG_ROOMS.map(([k,l])=>`<option value="${k}" ${s.room===k?'selected':''}>${esc(l)}</option>`).join('');const styles=STG_STYLES.map(([k,l])=>`<button data-stg-style="${k}" class="${s.style===k?'primary':'secondary'}">${esc(l)}</button>`).join('');const modes=[['furnish','加家具'],['clear','清空家具']].map(([k,l])=>`<button data-stg-mode="${k}" class="${s.mode===k?'primary':'secondary'}">${esc(l)}</button>`).join('');m.innerHTML=`<div class="compare-modal" style="max-width:760px"><div class="modal-head"><div><span class="eyebrow">AI VIRTUAL STAGING</span><h2>AI 虛擬裝修 / 清空</h2><p style="color:var(--muted);font-size:12px;margin-top:6px">只係相片選擇；按「生成」先會呼叫 /api/staging-generate。</p></div><button data-close>×</button></div><label style="font-size:12px;color:var(--muted)">揀內觀相片</label><div class="thumbs" style="margin:8px 0 14px">${photos||'<span style="color:var(--muted);font-size:12px">暫無可用相片</span>'}</div>${s.photoUrl?`<div class="gallery-main" style="height:240px;margin-bottom:14px"><img src="${esc(s.photoUrl)}" style="width:100%;height:100%;object-fit:contain"></div>`:''}<label style="font-size:12px;color:var(--muted)">房間類型</label><select id="stgRoom" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px">${rooms}</select><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${styles}</div><div style="display:flex;gap:8px;margin-bottom:14px">${modes}</div><button class="primary" id="stgGenerateBtn" ${s.photoUrl?'':'disabled'}>生成</button><div id="stgProgress" class="hidden" style="margin-top:10px;color:var(--green2);font-size:12px">生成中...</div>${s.result?`<div class="review-box" style="margin-top:12px">${s.result.error?esc(s.result.error):'生成完成'}</div>`:''}</div>`;m.querySelector('[data-close]').onclick=()=>m.classList.add('hidden');m.querySelectorAll('[data-stg-photo]').forEach(el=>el.onclick=()=>stgPick('photoUrl',el.dataset.stgPhoto));m.querySelectorAll('[data-stg-style]').forEach(el=>el.onclick=()=>stgPick('style',el.dataset.stgStyle));m.querySelectorAll('[data-stg-mode]').forEach(el=>el.onclick=()=>stgPick('mode',el.dataset.stgMode));$('stgRoom').onchange=e=>stgPick('room',e.target.value);$('stgGenerateBtn').onclick=runStaging}
    async function runStaging(){const s=state.stg;if(!s.photoUrl){toast('請先揀相片');return}const btn=$('stgGenerateBtn'),prog=$('stgProgress');if(btn){btn.disabled=true;btn.style.opacity='.5'}if(prog)prog.classList.remove('hidden');try{const d=await api('/api/staging-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listing_id:s.lid,photo_url:s.photoUrl,room_type:s.room,style:s.style,mode:s.mode})});state.stg.result=d}catch(e){state.stg.result={error:e.message}}renderStagingModal()}
    function openCompare(){const items=state.selected.map(id=>state.items.find(x=>x.id===id)).filter(Boolean);if(items.length<2){toast('請最少揀 2 個房源');return}const rows=[['售價',p=>price(p.priceYen)],['所在地',p=>p.address],['交通',p=>p.station+(p.walkMinutes?' 徒步 '+p.walkMinutes+' 分鐘':'')],['間隔',p=>p.layout],['面積',p=>p.areaSqm+'㎡'],['樓層',p=>p.floor?`${p.floor}F / ${p.totalFloors||'—'}F`:'—'],['築年月',p=>p.builtAt],['管理費',p=>yen(p.managementFeeYen)],['完整度',p=>pct(p.completeness)+'%']];$('compareModal').innerHTML=`<div class="modal-head"><div><span class="eyebrow">PROPERTY COMPARE</span><h2>房源比較</h2></div><button id="closeCompare">×</button></div><div class="compare-scroll"><table><thead><tr><th>比較欄位</th>${items.map(p=>`<th><strong>${esc(p.title)}</strong></th>`).join('')}</tr></thead><tbody>${rows.map(([label,get])=>`<tr><th>${esc(label)}</th>${items.map(p=>`<td>${esc(get(p)||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;$('compareOverlay').classList.remove('hidden');$('closeCompare').onclick=()=>$('compareOverlay').classList.add('hidden')}
    function renderClients(){
      const saved=JSON.parse(localStorage.getItem('gift22-active-client')||'null');
      const select=$('clientFilter');
      select.innerHTML='<option value="">全部房源／未指定客戶</option>'+state.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}（${c.shortlist_count||0}）</option>`).join('');
      if(saved&&state.clients.some(c=>c.id===saved.id)){state.activeClient=saved.id;select.value=saved.id}
      $('arrangeViewing').disabled=!state.activeClient;
      select.onchange=()=>{state.activeClient=select.value;const c=state.clients.find(x=>x.id===state.activeClient);if(c)localStorage.setItem('gift22-active-client',JSON.stringify({id:c.id,name:c.name}));else localStorage.removeItem('gift22-active-client');$('arrangeViewing').disabled=!state.activeClient;$('clientHint').textContent=c?`目前為 ${c.name} 整理私人房源`:'建立或選擇客戶後，首頁搜尋結果可一鍵加入佢嘅私人房源。';applyFilters()};
    }
    async function createClient(){
      const name=prompt('客戶名稱（例：客人 A）');if(!name||!name.trim())return;
      const requirement=prompt('客戶需求（可留空）','')||'';
      try{const d=await api('/api/v1/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim(),requirementText:requirement.trim()})});state.clients.unshift({...d.client,shortlist_count:0});state.activeClient=d.client.id;localStorage.setItem('gift22-active-client',JSON.stringify({id:d.client.id,name:d.client.name}));renderClients();$('clientFilter').value=d.client.id;$('clientHint').textContent=`目前為 ${d.client.name} 整理私人房源`;applyFilters();toast('客戶已建立，可以返首頁加入房源')}catch(e){toast('建立失敗：'+e.message)}
    }
    function setMode(mode){state.mode=mode;$('reviewMode').classList.toggle('active',mode==='review');$('buyerMode').classList.toggle('active',mode==='buyer');$('eyebrow').textContent=mode==='review'?'REVIEW WORKSPACE':'BUYER DISCOVERY';$('heroTitle').textContent=mode==='review'?'今日房源整理':'揀出值得睇嘅房源';$('heroCopy').textContent=mode==='review'?'集中檢查真實房源、圖片與主要欄位。':'快速搜尋、收藏同時比較重點條件。';render()}
    async function openViewingPlanner(){
      if(!state.activeClient){toast('請先選擇客戶');return}
      window.location.href='/workbench/viewing-planner?clientId='+encodeURIComponent(state.activeClient);
    }
    function routeSelectedItems(){return state.route.items.filter(x=>state.route.selected.has(x.id))}
    function renderViewingPlanner(){const m=ensureModal('viewingPlannerModal',95),r=state.route,now=new Date(Date.now()+86400000),date=now.toISOString().slice(0,10);const items=(r.items||[]).map(p=>`<label class="route-item ${p.routeEligible?'':'disabled'}"><input type="checkbox" data-route-pick="${esc(p.id)}" ${r.selected.has(p.id)?'checked':''} ${p.routeEligible?'':'disabled'}><div><strong>${esc(p.title)}</strong><span class="muted">${esc(p.address)} · ${esc(p.station||'')}</span>${p.routeEligible?'':'<div class="route-warn">缺少座標，不會估算位置</div>'}</div></label>`).join('')||'<div class="empty">呢個客戶未有 shortlist 房源</div>';const plans=(r.plans||[]).map(p=>`<button class="secondary" data-open-plan="${esc(p.id)}">重開：${esc(p.title)}</button>`).join('');m.innerHTML=`<div class="compare-modal" style="max-width:1180px"><div class="modal-head"><div><span class="eyebrow">VIEWING ROUTE MVP</span><h2>安排睇樓 — ${esc(r.client?.name||'客戶')}</h2><p class="muted">只顯示呢位客戶 shortlisted properties；請選 2–8 間。</p></div><button data-close>×</button></div><div style="padding:20px;overflow:auto;max-height:calc(96vh - 90px)"><div class="route-grid"><div><div class="section-title"><h3>客戶 shortlisted 房源</h3><span>已選 ${r.selected.size}/8</span></div><div class="route-list">${items}</div>${plans?`<div class="route-actions">${plans}</div>`:''}</div><div><div class="route-form"><label>睇樓日期<input id="routeDate" type="date" value="${date}"></label><label>出發時間<input id="routeTime" type="time" value="10:00"></label><label>出發地點<input id="routeStartLabel" value="東京駅"></label><label>出發緯度<input id="routeStartLat" type="number" step="0.000001" value="35.681236"></label><label>出發經度<input id="routeStartLon" type="number" step="0.000001" value="139.767125"></label><label>睇樓時間<select id="routeDuration"><option value="30">30 分鐘</option><option value="45" selected>45 分鐘</option><option value="60">60 分鐘</option></select></label><label>交通模式<select id="routeMode"><option value="driving">駕車 / Taxi</option><option value="transit">公共交通</option></select></label><label>終點（可留空同出發點）<input id="routeEndLabel" placeholder="預設同出發地點"></label></div><div class="route-actions"><button class="primary" id="routeOptimize">優化路線</button><button class="secondary" id="routeReorder" ${r.optimized?'':'disabled'}>重新排序</button><button class="primary" id="routeSave" ${r.optimized?'':'disabled'}>保存路線</button></div><div id="routeResult">${renderRouteResult()}</div></div></div></div></div>`;m.querySelector('[data-close]').onclick=()=>m.classList.add('hidden');m.querySelectorAll('[data-route-pick]').forEach(el=>el.onchange=()=>{if(el.checked){if(r.selected.size>=8){el.checked=false;toast('最多 8 間');return}r.selected.add(el.dataset.routePick)}else r.selected.delete(el.dataset.routePick);r.optimized=null;renderViewingPlanner()});m.querySelector('#routeOptimize').onclick=()=>optimizeViewingRoute();m.querySelector('#routeSave').onclick=saveViewingPlan;m.querySelector('#routeReorder').onclick=manualReorderRoute;m.querySelectorAll('[data-open-plan]').forEach(el=>el.onclick=()=>openSavedPlan(el.dataset.openPlan));bindRouteDrag();}
    function renderRouteResult(){const o=state.route.optimized,p=state.route.plan;if(!o&&!p)return '<div class="route-warn">未優化；公共交通如 provider 不支援，會直接顯示限制，唔會估時間。</div>';const plan=p||o,stops=plan.stops||[],tot=plan.totals||plan;let minLat=999,maxLat=-999,minLon=999,maxLon=-999;stops.forEach(s=>{const pr=s.property||s;minLat=Math.min(minLat,pr.latitude||s.lat);maxLat=Math.max(maxLat,pr.latitude||s.lat);minLon=Math.min(minLon,pr.longitude||s.lon);maxLon=Math.max(maxLon,pr.longitude||s.lon)});const markers=stops.map(s=>{const pr=s.property||s,lat=pr.latitude||s.lat,lon=pr.longitude||s.lon,x=maxLon===minLon?50:(lon-minLon)/(maxLon-minLon)*80+10,y=maxLat===minLat?50:(maxLat-lat)/(maxLat-minLat)*80+10;return `<div class="route-marker" style="left:${x}%;top:${y}%">${s.seq}</div>`}).join('');const fmt=t=>t?new Date(t).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}):'—';return `<div class="route-map">${markers}<div style="position:absolute;left:12px;bottom:12px;color:var(--muted);font-size:12px">示意地圖 · 編號 marker</div></div><div class="summary" style="grid-template-columns:repeat(2,1fr)"><div><span>總交通</span><strong>${esc(tot.totalTravelMinutes)} 分鐘</strong></div><div><span>全程</span><strong>${esc(tot.totalItineraryMinutes)} 分鐘</strong></div></div>${(plan.warnings||[]).map(w=>`<div class="route-warn">${esc(w.message)}</div>`).join('')}<div class="route-timeline">${stops.map(s=>{const pr=s.property||s;return `<div class="route-stop" draggable="true" data-stop-id="${esc(s.listingId)}"><div class="seq">${s.seq}</div><div><strong>${esc(pr.title||pr.address)}</strong><div class="muted">${esc(pr.address||'')} · ${esc(pr.station||'')}</div><div class="times"><span>出發 ${fmt(s.departAt)}</span><span>車程 ${esc(s.travelMinutes)} 分</span><span>到達 ${fmt(s.arriveAt)}</span><span>睇樓 ${fmt(s.viewingStartAt)}–${fmt(s.viewingEndAt)}</span></div><a href="/listing/${encodeURIComponent(s.listingId)}" target="_blank">物件詳情 ↗</a></div><a class="open-btn" href="${esc(s.navigationUrl)}" target="_blank">開始導航</a></div>`}).join('')}</div>${p&&p.shareUrl?`<div class="share-box">分享：<a href="${esc(p.shareUrl)}" target="_blank">${location.origin}${esc(p.shareUrl)}</a><div class="route-actions"><button class="danger" id="routeRevoke">撤回分享</button><button class="secondary" id="routeRegen">重新產生分享</button></div></div>`:''}`}
    async function optimizeViewingRoute(manualOrder){try{const ids=manualOrder||[...state.route.selected];const body={clientId:state.activeClient,listingIds:ids,manualOrder:manualOrder||[],viewingDate:$('routeDate').value,departureTime:$('routeTime').value,start:{label:$('routeStartLabel').value,lat:$('routeStartLat').value,lon:$('routeStartLon').value},end:{label:$('routeEndLabel').value},viewingDurationMin:Number($('routeDuration').value),travelMode:$('routeMode').value};const d=await api('/api/v1/viewing-plans/optimize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});state.route.optimized=d;state.route.plan=null;renderViewingPlanner();toast('路線已優化')}catch(e){toast('優化失敗：'+e.message)}}
    function manualReorderRoute(){const ids=(state.route.optimized?.stops||[]).map(s=>s.listingId).reverse();optimizeViewingRoute(ids)}
    async function saveViewingPlan(){try{const o=state.route.optimized;if(!o){toast('請先優化');return}const body={clientId:state.activeClient,listingIds:o.listingIds,departureAt:o.departureAt,start:o.start,end:o.end,viewingDurationMin:o.viewingDurationMin,travelMode:o.travelMode,optimized:o,title:o.viewingDate+' 智慧睇樓路線'};const d=await api('/api/v1/viewing-plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});state.route.plan=d.plan;state.route.plans.unshift(d.plan);renderViewingPlanner();toast('已保存，可重開及分享')}catch(e){toast('保存失敗：'+e.message)}}
    async function openSavedPlan(id){try{const d=await api('/api/v1/viewing-plans/'+encodeURIComponent(id));state.route.plan=d.plan;state.route.optimized=null;renderViewingPlanner()}catch(e){toast('重開失敗：'+e.message)}}
    async function shareAction(kind){const p=state.route.plan;if(!p)return;try{const d=await api(`/api/v1/viewing-plans/${encodeURIComponent(p.id)}/share`,{method:kind==='revoke'?'DELETE':'POST'});state.route.plan=d.plan;renderViewingPlanner();toast(kind==='revoke'?'分享已撤回':'分享連結已更新')}catch(e){toast('分享操作失敗：'+e.message)}}
    function bindRouteDrag(){const root=$('viewingPlannerModal');if(!root)return;const rev=root.querySelector('#routeRevoke'),reg=root.querySelector('#routeRegen');if(rev)rev.onclick=()=>shareAction('revoke');if(reg)reg.onclick=()=>shareAction('regen');root.querySelectorAll('.route-stop').forEach(el=>{el.ondragstart=()=>{state.route.dragId=el.dataset.stopId;el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const from=state.route.dragId,to=el.dataset.stopId,ids=(state.route.optimized?.stops||[]).map(s=>s.listingId);const a=ids.indexOf(from),b=ids.indexOf(to);if(a>=0&&b>=0){ids.splice(b,0,ids.splice(a,1)[0]);optimizeViewingRoute(ids)}}})}
    $('newClient').onclick=createClient;$('arrangeViewing').onclick=openViewingPlanner;$('reviewMode').onclick=()=>setMode('review');$('buyerMode').onclick=()=>setMode('buyer');$('filterBtn').onclick=()=>{$('filterPanel').classList.toggle('hidden');$('filterBtn').classList.toggle('active')};$('areaTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('areaTabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.area=b.dataset.area;applyFilters()});['search','layout','maxPrice','source','completeOnly','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',applyFilters));$('reset').onclick=()=>{$('layout').value='';$('maxPrice').value='0';$('source').value='';$('completeOnly').checked=false;applyFilters()};$('compareNow').onclick=openCompare;$('drawerOverlay').onclick=e=>{if(e.target===$('drawerOverlay'))closeDrawer()};$('compareOverlay').onclick=e=>{if(e.target===$('compareOverlay'))$('compareOverlay').classList.add('hidden')};load();
  </script>
</body>
